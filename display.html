<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sim Lab - Week at a Glance</title>
<style>
  :root { color-scheme:dark; --bg:#0d1b2a; --panel:#152c42; --line:#2c4257;
          --fg:#fff; --muted:#8fb3cc; --today:#17334d; --note:#ffd9a0;
          --divider:#d05a5a; --s:1; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
              font-family:"Segoe UI",system-ui,sans-serif; overflow:hidden; }
  header { display:flex; align-items:baseline; gap:20px; padding:10px 18px; }
  h1 { font-size:calc(2.1vw * var(--s)); margin:0; letter-spacing:1px; }
  #sub { font-size:calc(1.2vw * var(--s)); color:var(--muted); }
  #clock { margin-left:auto; font-size:calc(1.5vw * var(--s)); color:var(--muted); }
  #clock.hide, #sub.hide { display:none; }
  #admin { display:flex; gap:6px; margin-left:14px; }
  #admin button { background:transparent; border:1px solid var(--line);
                  color:var(--muted); border-radius:6px; cursor:pointer;
                  font-size:calc(1.0vw * var(--s)); padding:4px 9px; }
  #admin button:hover { color:var(--fg); border-color:var(--muted); }
  #admin.hide { display:none; }
  #admin button.on { color:#8fe0a0; border-color:#8fe0a0; }
  #notes { border-top:2px solid var(--line); background:var(--panel);
           padding:8px 14px 12px; }
  #notes.hide { display:none; }
  #notesHead { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
  #notesTitle { margin:0; font-size:calc(1.0vw * var(--s)); letter-spacing:1px;
                color:var(--muted); text-transform:uppercase; }
  #noteList { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-start;
              overflow-y:auto; max-height:var(--nh, 24vh); }
  .note { border:1px solid rgba(0,0,0,.25); border-radius:7px;
          padding:11px 13px; min-width:200px; max-width:340px;
          font-size:calc(0.85vw * var(--s)); line-height:1.35; cursor:pointer;
          white-space:pre-wrap; word-break:break-word; position:relative;
          font-weight:500; box-shadow:0 2px 6px rgba(0,0,0,.25); }
  .note:hover { outline:2px solid #fff; outline-offset:1px; }
  .note .meta { display:block; margin-top:8px; font-size:84%; opacity:.72;
                font-weight:400; }
  .note.pinned::after { content:"PIN"; position:absolute; top:5px; right:7px;
                        font-size:9px; letter-spacing:1px; opacity:.6;
                        font-weight:700; }
  #noteEditor { position:fixed; inset:0; background:rgba(5,12,20,.72); display:none;
                align-items:center; justify-content:center; padding:20px; z-index:60; }
  #noteEditor.on { display:flex; }
  #noteBox { background:var(--panel); border:1px solid var(--line); border-radius:10px;
             width:min(640px,100%); padding:18px 20px; }
  #noteBox h3 { margin:0 0 10px; font-size:19px; }
  #noteText { width:100%; min-height:170px; font-size:17px; line-height:1.45;
              padding:12px; border-radius:6px; border:1px solid #8fa6bd;
              background:#ffffff; color:#102a43; resize:vertical;
              font-family:inherit; }
  #noteColors { display:flex; gap:8px; margin:12px 0; flex-wrap:wrap; }
  #noteColors button { width:36px; height:36px; border-radius:50%; border:2px solid
                       transparent; cursor:pointer; }
  #noteColors button.sel { border-color:#ffffff; box-shadow:0 0 0 2px #12263a; }
  #noteColors input[type=color] { width:36px; height:36px; padding:0; border:2px
                       solid #4a6a88; border-radius:50%; background:none;
                       cursor:pointer; }
  #noteColors .customwrap { display:flex; align-items:center; gap:5px;
                       font-size:11px; color:#8fb3cc; }
  #noteHint { font-size:12px; color:var(--muted); margin:10px 0 0; }
  #emptyWeek { padding:18px; color:var(--muted);
               font-size:calc(1.1vw * var(--s)); text-align:center; }
  html,body.multi { overflow:auto; height:auto; }
  #board { padding:0 10px 24px; }
  #panels { display:grid; grid-template-columns:repeat(var(--cols,3), 1fr);
            gap:14px; }
  .panel { border:1px solid var(--line); border-radius:8px; overflow:hidden;
           background:var(--panel); }
  .panel.now { outline:2px solid #4f9ad6; }
  .panel h2 { margin:0; padding:6px 9px; font-size:13px; letter-spacing:.5px;
              background:var(--panel); color:var(--fg);
              border-bottom:1px solid var(--line); }
  .panel h2 span { font-weight:400; color:var(--muted); margin-left:6px; }
  .panel table { background:var(--bg); }
  table { width:100%; border-collapse:collapse; table-layout:fixed; }
  table.compact th, table.compact td { font-size:calc(7px * var(--s));
                                       padding:1px; line-height:1.1; }
  table.compact td.day { font-size:calc(7.5px * var(--s)); }
  table.compact td.notes { font-size:calc(6.5px * var(--s)); }
  table.compact .chip { padding:1px; border-radius:2px;
                        overflow:hidden; white-space:nowrap;
                        text-overflow:ellipsis; }
  table.compact .banner { font-size:calc(9px * var(--s)); letter-spacing:2px; }
  th,td { border:1px solid var(--line); padding:4px 3px;
          font-size:calc(0.85vw * var(--s)); text-align:center;
          vertical-align:top; overflow:hidden; }
  th { background:var(--panel); font-size:calc(0.95vw * var(--s)); padding:7px 3px; }
  td.day { background:var(--panel); font-weight:700;
           font-size:calc(1.0vw * var(--s)); width:4.5%; }
  td.notes { text-align:left; font-size:calc(0.8vw * var(--s)); width:9%;
             color:var(--note); }
  td.clickable { cursor:pointer; }
  tr.today td { background:var(--today); }
  tr.today td.day { background:#1f4e79; }
  .chip { display:block; border-radius:3px; padding:3px 2px; margin:1px 0;
          font-weight:600; line-height:1.15; }
  .chip small { display:block; font-weight:400; opacity:.85; font-size:88%; }
  .tentative { opacity:.55; border:1px dashed #fff; }
  .banner { font-size:calc(1.6vw * var(--s)); letter-spacing:6px;
            color:#ff9e9e; font-weight:700; }
  #offline { display:none; background:#8b1a1a; text-align:center; padding:8px;
             font-size:calc(1.2vw * var(--s)); font-weight:700; }
  .group-end { border-right:3px solid var(--divider); }

  /* tap-for-detail popup */
  #overlay { position:fixed; inset:0; background:rgba(5,12,20,.72); display:none;
             align-items:center; justify-content:center; padding:20px; z-index:50; }
  #overlay.on { display:flex; }
  #card { background:#12263a; color:#eaf1f8; border:1px solid #2c4257;
          border-radius:10px; width:min(620px,100%); max-height:100%;
          overflow-y:auto; }
  #cardHead { padding:18px 20px 14px; border-bottom:1px solid #2c4257;
              display:flex; gap:12px; align-items:flex-start; }
  #cardRoom { font-size:30px; font-weight:700; color:#ffffff; }
  #cardDate { font-size:15px; color:#8fb3cc; margin-top:3px; }
  #close { margin-left:auto; background:none; border:1px solid #2c4257;
           color:#8fb3cc; border-radius:6px; width:38px; height:38px;
           font-size:20px; cursor:pointer; }
  #cardBody { padding:16px 20px 20px; }
  .entry { border-left:5px solid #8fb3cc; background:#0f1f30; color:#eaf1f8;
           border-radius:6px; padding:12px 14px; margin-bottom:12px; }
  .entry h3 { margin:0 0 2px; font-size:19px; }
  .entry .when { font-size:15px; color:#8fb3cc; margin-bottom:10px; }
  .kv { display:grid; grid-template-columns:100px 1fr; gap:4px 10px; font-size:15px; }
  .kv dt { color:#8fb3cc; }
  .kv dd { margin:0; }
  .flag { display:inline-block; background:#7a3b12; color:var(--note);
          border-radius:4px; padding:1px 7px; font-size:13px; font-weight:700;
          margin-left:6px; }
  .flag.over { background:#7a1c1c; color:#ffc9c9; }
  .empty { color:#8fb3cc; font-size:16px; }
  #cardNote { margin-top:6px; padding:10px 12px; border-radius:6px;
              background:#2a2416; color:#ffd9a0; font-size:15px; }
  #timeout { font-size:13px; color:#8fb3cc; padding:0 20px 16px; }
  .btn { background:#1f3864; color:#fff; border:0; border-radius:5px;
         padding:8px 13px; font-weight:600; font-size:14px; cursor:pointer;
         margin:0 6px 6px 0; }
  .btn.ghost { background:transparent; color:#cfe0ee; border:1px solid #4a6a88; }
  .btn.danger { background:transparent; color:#ff9e9e; border:1px solid #ff9e9e; }
  .btn.small { padding:4px 9px; font-size:12px; margin:0; }
  .f label { display:block; font-size:12px; font-weight:600; color:#8fb3cc;
             margin:9px 0 2px; }
  /* Fields keep their own colours on purpose. Inheriting the board theme
     meant a light background could end up with light text on it. */
  .f input, .f select, .f textarea {
      width:100%; padding:9px; border-radius:4px; border:1px solid #8fa6bd;
      background:#ffffff; color:#102a43; font-size:16px; }
  .f input::placeholder { color:#7a8794; }
  .f select { appearance:auto; }
  .f .two { display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
  #roomPick { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  #roomPick label { display:inline-flex; align-items:center; gap:5px; margin:0;
                    border:1px solid var(--line); border-radius:6px;
                    padding:7px 10px; font-size:14px; color:var(--fg);
                    cursor:pointer; user-select:none; }
  #roomPick label.on { background:#1f3864; border-color:#4f9ad6; }
  #roomPick input { width:auto; }
  #quickPick { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 0; }
  #quickPick button { font-size:12px; padding:4px 9px; }
  #stationBlock { margin-top:12px; border-top:1px solid var(--line);
                  padding-top:10px; }
  .stn { border:1px solid #2c4257; background:#0f1f30; color:#eaf1f8;
         border-radius:7px; padding:9px 11px; margin-bottom:8px; }
  .stn b { font-size:14px; }
  .stn .tag { font-size:11px; color:#8fb3cc; margin-left:6px;
              text-transform:uppercase; letter-spacing:1px; }
  .stn input { margin-top:5px; background:#fff; color:#102a43;
               border:1px solid #8fa6bd; border-radius:4px; padding:8px;
               width:100%; font-size:15px; }
  .setup { border-left:5px solid #8fb3cc; background:#0f1f30; color:#eaf1f8;
           border-radius:6px; padding:11px 13px; margin-bottom:8px; }
  .setup b { font-size:16px; color:#ffffff; }
  .setup .tag { font-size:11px; color:#8fb3cc; margin-left:6px;
                text-transform:uppercase; letter-spacing:1px; }
  .setup .sk { color:#eaf1f8; }
  .setup .sup { color:#ffd9a0; font-size:14px; display:block; margin-top:3px; }
  .stationline { display:block; font-size:13px; color:#8fb3cc; margin-top:3px; }
  .itemrow { display:flex; gap:7px; align-items:center; margin-bottom:6px; }
  .itemrow select.sx_type { flex:none; width:132px; }
  .itemrow input.sx_label { flex:1; width:auto; }
  .itemrow select { flex:1; background:#fff; color:#102a43;
                    border:1px solid #8fa6bd; border-radius:4px; padding:8px; }
  .itemrow input { width:74px; background:#fff; color:#102a43;
                   border:1px solid #8fa6bd; border-radius:4px; padding:8px; }
  .avail { font-size:12px; margin-left:2px; white-space:nowrap; }
  .avail.ok { color:#8fe0a0; }
  .avail.over { color:#ff9e9e; font-weight:700; }
  .itemchip { display:inline-block; background:#0f1f30; border:1px solid #2c4257;
              color:#eaf1f8; border-radius:12px; padding:2px 9px; font-size:12px;
              margin:3px 4px 0 0; }
  .itemchip.over { border-color:#ff9e9e; color:#ff9e9e; }
  .entryhead { display:flex; align-items:center; gap:8px; }
  .entryhead h3 { flex:1; }
</style>
</head>
<body>
<div id="offline">CONNECTION LOST - schedule may be out of date</div>
<header>
  <h1 id="wkTitle">Loading...</h1>
  <div id="sub"></div>
  <div id="clock"></div>
  <div id="admin">
    <button id="gear" title="Display settings">&#9881;</button>
    <button id="who" title="Staff sign in">&#128274;</button>
  </div>
</header>
<div id="board"></div>

<section id="notes">
  <div id="notesHead">
    <h2 id="notesTitle">Notes &amp; Ideas</h2>
    <button class="btn small" id="addNote">+ Add note</button>
  </div>
  <div id="noteList"></div>
</section>

<div id="overlay">
  <div id="card" role="dialog" aria-modal="true">
    <div id="cardHead">
      <div><div id="cardRoom"></div><div id="cardDate"></div></div>
      <button id="close" aria-label="Close">&times;</button>
    </div>
    <div id="cardBody"></div>
    <div id="timeout"></div>
  </div>
</div>

<div id="noteEditor">
  <div id="noteBox">
    <h3 id="noteBoxTitle">New note</h3>
    <textarea id="noteText" placeholder="Type anything -- an idea, a reminder, a question for the team."></textarea>
    <div id="noteColors"></div>
    <p>
      <button class="btn" id="noteSave">Save</button>
      <button class="btn ghost" id="noteCancel">Cancel</button>
      <button class="btn ghost" id="notePin">Pin</button>
      <button class="btn danger" id="noteDel">Delete</button>
    </p>
    <p id="noteHint">Ctrl+Enter saves &middot; Esc cancels</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { initializeFirestore, persistentLocalCache, collection, doc, query,
         where, orderBy, onSnapshot, addDoc, updateDoc, deleteDoc, setDoc,
         serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { firebaseConfig, COLORS as FALLBACK_COLORS, DEFAULT_SETTINGS }
  from "./firebase-config.js";

// Persistent cache: if the network drops, the board keeps showing the last
// known schedule instead of going blank.
const fbApp = initializeApp(firebaseConfig);
// autoDetectLongPolling: campus networks, proxies and VPN clients often break
// Firestore's streaming connection, which is what produced the constant
// "connection lost" banner. This makes the SDK fall back to long polling.
const db = initializeFirestore(fbApp, {
  localCache: persistentLocalCache(),
  experimentalAutoDetectLongPolling: true
});
const auth = getAuth(fbApp);
let user = null;
onAuthStateChanged(auth, u => { user = u; paintAuth(); });
const DAYS = ["Mon","Tues","Wed","Thurs","Fri","Sat","Sun"];

let rooms = [], bookings = [], notes = {}, offset = 0, rotating = true;
let settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
let colors = settings.colors;
let lastData = Date.now(), lastFlip = Date.now();
let haveData = false, cacheSince = 0;

// Firestore reports whether a snapshot came from the server or the local
// cache. That is far more reliable than navigator.onLine, which flaps on
// campus wifi and VPNs and was causing the banner to flash on and off.
function noteSnapshot(snap) {
  const fromCache = snap.metadata && snap.metadata.fromCache;
  if (fromCache) { if (!cacheSince) cacheSince = Date.now(); }
  else { cacheSince = 0; lastData = Date.now(); }
  return fromCache;
}
const startDay = iso(new Date());

function iso(d) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0")
         + "-" + String(d.getDate()).padStart(2,"0");
}
function addDays(d,n) { const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function mondayOf(d) {
  const x = new Date(d);
  x.setDate(x.getDate() - ((x.getDay()+6) % 7));
  x.setHours(0,0,0,0);
  return x;
}
function esc(s) {
  return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

const base = mondayOf(new Date());
const rangeStart = iso(addDays(base,-120)); // back far enough to look at past weeks
const rangeEnd   = iso(addDays(base,370));  // a full year, so any selected week has data

/* ---------- live settings ---------- */
onSnapshot(doc(db,"settings","display"), snap => {
  if (snap.exists()) {
    const s = snap.data();
    settings = Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), s);
    if (s.theme)  settings.theme  = Object.assign({}, DEFAULT_SETTINGS.theme, s.theme);
    if (s.colors) settings.colors = s.colors;
  }
  colors = Object.assign({}, FALLBACK_COLORS, settings.colors || {});
  applyTheme();
  render();
  renderNotes();
});

function applyTheme() {
  const r = document.documentElement.style;
  const t = settings.theme || {};
  Object.keys(t).forEach(k => r.setProperty("--" + k, t[k]));
  r.setProperty("--s", settings.scale || 1);
  document.getElementById("clock").className = settings.showClock ? "" : "hide";
  document.getElementById("admin").className =
    settings.showAdminButtons === false ? "hide" : "";
  if (offset >= (settings.weeks || 2)) offset = 0;
}

/* ---------- live data ---------- */
onSnapshot(query(collection(db,"rooms"), orderBy("order")), snap => {
  const fromCache = noteSnapshot(snap);
  if (fromCache && snap.empty && rooms.length) return;
  rooms = snap.docs.map(d => ({id:d.id, ...d.data()})).filter(r => r.active !== false);
  render();
}, err => console.error("rooms listener:", err));
onSnapshot(query(collection(db,"bookings"),
                 where("date",">=",rangeStart), where("date","<=",rangeEnd)), snap => {
  const fromCache = noteSnapshot(snap);
  // An empty snapshot served from cache during a dropout is not news --
  // it is the absence of news. Keep what is already on screen.
  if (fromCache && snap.empty && haveData) return;
  bookings = snap.docs.map(d => ({id:d.id, ...d.data()}));
  if (bookings.length) haveData = true;
  render();
}, err => console.error("bookings listener:", err));
onSnapshot(query(collection(db,"dayNotes"),
                 where("date",">=",rangeStart), where("date","<=",rangeEnd)), snap => {
  const fromCache = noteSnapshot(snap);
  if (fromCache && snap.empty && Object.keys(notes).length) return;
  notes = {};
  snap.docs.forEach(d => notes[d.id] = d.data());
  render();
}, err => console.error("dayNotes listener:", err));

function weekLabel(off) {
  if (off === 0) return settings.title || "THIS WEEK";
  if (off === 1) return "NEXT WEEK";
  return "WEEK OF";
}

// One week as a table. Used by both layouts.
function weekTableHTML(weekStart, opts) {
  const today = iso(new Date());
  const nDays = settings.showWeekend === false ? 5 : 7;
  const compact = opts && opts.compact;

  let html = "<table class='wk" + (compact ? " compact" : "") + "'>";
  html += "<tr><th>Week</th>";
  rooms.forEach((r,i) => {
    const end = i < rooms.length-1 && rooms[i+1].group !== r.group;
    html += "<th class='" + (end ? "group-end" : "") + "'>" + esc(r.label) + "</th>";
  });
  if (settings.showComments !== false) html += "<th>Comments</th>";
  html += "</tr>";

  for (let i = 0; i < nDays; i++) {
    const d = addDays(weekStart,i), key = iso(d), note = notes[key] || {};
    html += "<tr class='" + (key === today ? "today" : "") + "'>";
    html += "<td class='day clickable' data-date='" + key + "'>" + DAYS[i] +
            "<br>" + (d.getMonth()+1) + "/" + d.getDate() + "</td>";
    if (note.banner) {
      html += "<td colspan='" + rooms.length + "' class='banner'>" +
              esc(note.banner) + "</td>";
    } else {
      rooms.forEach((r,ri) => {
        const end = ri < rooms.length-1 && rooms[ri+1].group !== r.group;
        const cells = bookings.filter(b => b.date === key && b.roomId === r.id);
        html += "<td class='clickable " + (end ? "group-end" : "") +
                "' data-date='" + key + "' data-room='" + r.id + "'>";
        cells.forEach(b => {
          html += "<span class='chip " + (b.status === "tentative" ? "tentative" : "") +
                  "' style='background:" + (colors[b.color]||colors.grey||"#7a8794") + "'>" +
                  esc(b.course||"") +
                  (!compact && b.block ? "<small>" + esc(b.block) + "</small>" : "") +
                  "</span>";
        });
        html += "</td>";
      });
    }
    if (settings.showComments !== false)
      html += "<td class='notes'>" + esc(note.text||"") + "</td>";
    html += "</tr>";
  }
  return html + "</table>";
}

function weekRangeText(weekStart) {
  return weekStart.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " - " +
         addDays(weekStart,6).toLocaleDateString(undefined,{month:"short",day:"numeric"});
}

function render() {
  if (!rooms.length) return;
  const multi = settings.layout === "multi";
  document.body.classList.toggle("multi", multi);
  return multi ? renderMulti() : renderSingle();
}

function renderSingle() {
  const weekStart = addDays(base, offset*7);
  document.getElementById("wkTitle").textContent = weekLabel(offset);
  document.getElementById("sub").textContent =
    weekStart.toLocaleDateString(undefined,{month:"long",day:"numeric"}) + " - " +
    addDays(weekStart,6).toLocaleDateString(undefined,
      {month:"long",day:"numeric",year:"numeric"});

  const host = document.getElementById("board");
  host.innerHTML = weekTableHTML(weekStart, {compact:false});

  // Make an empty week unmistakable. Without this, rotating to a blank
  // next week reads as "the schedule vanished".
  const ws = weekStart, we = addDays(weekStart,6);
  const any = bookings.some(b => {
    const d = new Date(b.date+"T00:00:00");
    return d >= ws && d <= we;
  });
  if (!any) {
    const p = document.createElement("div");
    p.id = "emptyWeek";
    p.textContent = "Nothing scheduled this week yet.";
    host.appendChild(p);
  }
}

function renderMulti() {
  const n     = Math.max(1, Math.min(26, settings.multiWeeks || 8));
  const start = settings.startOffset || 0;
  const cols  = Math.max(1, Math.min(6, settings.multiCols || 3));

  const first = addDays(base, start*7);
  const last  = addDays(base, (start + n - 1)*7 + 6);
  document.getElementById("wkTitle").textContent =
    settings.title || (n + " WEEKS");
  document.getElementById("sub").textContent =
    first.toLocaleDateString(undefined,{month:"long",day:"numeric"}) + " - " +
    last.toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"});

  const host = document.getElementById("board");
  host.style.setProperty("--cols", cols);
  let html = "<div id='panels'>";
  for (let i = 0; i < n; i++) {
    const off = start + i;
    const ws  = addDays(base, off*7);
    const isNow = off === 0;
    html += "<section class='panel" + (isNow ? " now" : "") + "'>" +
            "<h2>" + (isNow ? "THIS WEEK" : "WK " + weekNumber(ws)) +
            " <span>" + weekRangeText(ws) + "</span></h2>" +
            weekTableHTML(ws, {compact:true}) + "</section>";
  }
  host.innerHTML = html + "</div>";
}

// Academic week number, counting from the configured semester start.
function weekNumber(d) {
  const s = settings.semesterStart ? new Date(settings.semesterStart + "T00:00:00")
                                   : null;
  if (!s) return Math.round((d - mondayOf(new Date()))/604800000);
  return Math.round((mondayOf(d) - mondayOf(s)) / 604800000) + 1;
}

function weekHasBookings(off) {
  const ws = addDays(base, off*7), we = addDays(ws, 6);
  return bookings.some(b => {
    const d = new Date(b.date+"T00:00:00");
    return d >= ws && d <= we;
  });
}

/* ---------- equipment inventory ---------- */
let inventory = [];

onSnapshot(collection(db,"inventory"), snap => {
  const fromCache = noteSnapshot(snap);
  if (fromCache && snap.empty && inventory.length) return;
  inventory = snap.docs.map(d => ({id:d.id, ...d.data()}))
                  .sort((a,b) => (a.name||"").localeCompare(b.name||""));
  render();
}, err => console.error("inventory listener:", err));

const itemById = id => inventory.find(i => i.id === id) || {name:id, qty:0};

// Every reservation of one item on one date, with where it is going.
function itemUsage(itemId, date, ignoreBookingId) {
  const out = [];
  bookings.forEach(b => {
    if (b.date !== date || b.id === ignoreBookingId) return;
    (b.items||[]).forEach(x => {
      if (x.id === itemId)
        out.push({ qty: x.qty || 1, roomId: b.roomId, course: b.course,
                   block: b.block, station: x.station || "" });
    });
  });
  return out;
}
function itemBooked(itemId, date, ignoreBookingId) {
  return itemUsage(itemId, date, ignoreBookingId)
           .reduce((n,u) => n + (u.qty||1), 0);
}

// Add something to the inventory without leaving whatever you were doing.
async function quickAddItem(then) {
  if (!user) return;
  const name = prompt("What is it? (e.g. HAL manikin)");
  if (!name || !name.trim()) return;
  const qty = parseInt(prompt("How many does the lab have?", "1"), 10);
  const id = name.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,40);
  await setDoc(doc(db,"inventory",id),
    { name: name.trim(), qty: isNaN(qty) ? 1 : qty, category: "", notes: "" });
  if (typeof then === "function") setTimeout(then, 400);
}

/* ---------- brainstorm notes ---------- */
let boardNotes = [], editingNote = null, noteColor = "yellow", noteHex = null;

// Pick black or white text for a background, so a custom colour can never
// produce an unreadable note.
function readableOn(hex) {
  const h = (hex||"").replace("#","");
  if (h.length !== 6) return "#ffffff";
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16),
        b = parseInt(h.slice(4,6),16);
  const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  return lum > 0.62 ? "#13202c" : "#ffffff";
}
const noteHexOf = n => n.hex || colors[n.color] || colors.yellow || "#b08f00";

onSnapshot(query(collection(db,"boardNotes"), orderBy("createdAt","desc")), snap => {
  const fromCache = noteSnapshot(snap);
  if (fromCache && snap.empty && boardNotes.length) return;
  boardNotes = snap.docs.map(d => ({id:d.id, ...d.data()}));
  renderNotes();
}, err => console.error("boardNotes listener:", err));

function renderNotes() {
  const sec = document.getElementById("notes");
  sec.className = settings.showNotes === false ? "hide" : "";
  document.getElementById("notesTitle").textContent =
    settings.notesTitle || "Notes & Ideas";
  document.documentElement.style.setProperty("--nh",
    (settings.notesHeightVh || 24) + "vh");
  document.getElementById("addNote").style.display = user ? "" : "none";

  const list = document.getElementById("noteList");
  const sorted = boardNotes.slice().sort((a,b) =>
    (b.pinned?1:0) - (a.pinned?1:0));
  if (!sorted.length) {
    const bg = colors.grey || "#7a8794";
    list.innerHTML = "<div class='note' style='background:" + bg + ";color:" +
      readableOn(bg) + "'>" +
      (user ? "No notes yet. Tap + Add note to start one."
            : "No notes yet.") + "</div>";
    return;
  }
  list.innerHTML = sorted.map(n => {
    const bg = noteHexOf(n);
    return "<div class='note" + (n.pinned ? " pinned" : "") + "' data-id='" +
      n.id + "' style='background:" + bg + ";color:" + readableOn(bg) + "'>" +
      esc(n.text || "") +
      "<span class='meta'>" + esc((n.author||"").split("@")[0]) +
      (n.updatedAt ? " &middot; " + fmtWhen(n.updatedAt) : "") + "</span></div>";
  }).join("");

  list.querySelectorAll(".note[data-id]").forEach(el => {
    el.onclick = () => {
      const n = boardNotes.find(x => x.id === el.dataset.id);
      if (user) noteEditor(n);
    };
  });
}

function fmtWhen(ts) {
  try {
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
  } catch (e) { return ""; }
}

function noteEditor(n) {
  if (!user) return;
  editingNote = n || null;
  noteColor = n ? (n.color || "yellow") : "yellow";
  noteHex = n ? (n.hex || null) : null;
  document.getElementById("noteBoxTitle").textContent = n ? "Edit note" : "New note";
  document.getElementById("noteText").value = n ? (n.text || "") : "";
  document.getElementById("noteDel").style.display = n ? "" : "none";
  document.getElementById("notePin").textContent =
    n && n.pinned ? "Unpin" : "Pin";
  document.getElementById("notePin").style.display = n ? "" : "none";

  const pal = document.getElementById("noteColors");
  pal.innerHTML = Object.entries(colors).map(([name,hex]) =>
      "<button data-c='" + name + "' data-hex='" + hex + "' title='" + name +
      "' style='background:" + hex + "' class='" +
      (!noteHex && name === noteColor ? "sel" : "") + "'></button>").join("") +
    "<span class='customwrap'><input type='color' id='noteCustom' value='" +
      (noteHex || colors[noteColor] || "#b08f00") + "' title='Any colour'>" +
      "custom</span>";

  function applyPreview() {
    const bg = noteHex || colors[noteColor] || "#b08f00";
    const ta = document.getElementById("noteText");
    ta.style.background = bg;
    ta.style.color = readableOn(bg);
  }

  pal.querySelectorAll("button").forEach(b => b.onclick = () => {
    noteColor = b.dataset.c; noteHex = null;
    pal.querySelectorAll("button").forEach(x => x.className = "");
    b.className = "sel";
    applyPreview();
  });
  const custom = document.getElementById("noteCustom");
  custom.oninput = () => {
    noteHex = custom.value; noteColor = "custom";
    pal.querySelectorAll("button").forEach(x => x.className = "");
    applyPreview();
  };
  applyPreview();

  document.getElementById("noteEditor").classList.add("on");
  const ta = document.getElementById("noteText");
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
}

function closeNoteEditor() {
  document.getElementById("noteEditor").classList.remove("on");
  editingNote = null;
}

async function saveNote() {
  const text = document.getElementById("noteText").value.trim();
  if (!text) { closeNoteEditor(); return; }
  const data = { text, color: noteColor, hex: noteHex || null,
                 author: user.email, updatedAt: serverTimestamp() };
  if (editingNote) await updateDoc(doc(db,"boardNotes",editingNote.id), data);
  else await addDoc(collection(db,"boardNotes"),
                    Object.assign({createdAt: serverTimestamp(), pinned:false}, data));
  closeNoteEditor();
}

document.getElementById("addNote").onclick = () => noteEditor(null);
document.getElementById("noteSave").onclick = saveNote;
document.getElementById("noteCancel").onclick = closeNoteEditor;
document.getElementById("noteDel").onclick = async () => {
  if (editingNote && confirm("Delete this note?")) {
    await deleteDoc(doc(db,"boardNotes",editingNote.id));
    closeNoteEditor();
  }
};
document.getElementById("notePin").onclick = async () => {
  if (!editingNote) return;
  await updateDoc(doc(db,"boardNotes",editingNote.id), { pinned: !editingNote.pinned });
  closeNoteEditor();
};
document.getElementById("noteEditor").addEventListener("click", ev => {
  if (ev.target.id === "noteEditor") closeNoteEditor();
});
document.getElementById("noteText").addEventListener("keydown", ev => {
  if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); saveNote(); }
  if (ev.key === "Escape") closeNoteEditor();
});

/* ---------- tap-for-detail popup ---------- */
const overlay = document.getElementById("overlay");
let closeTimer = null, countdown = null, wasRotating = true;

const roomOf    = id => rooms.find(r => r.id === id) || {};
const roomLabel = id => roomOf(id).label || id;
const longDate  = k => new Date(k + "T00:00:00")
  .toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});

function entryHtml(b, showRoom) {
  const cap  = roomOf(b.roomId).capacity;
  const over = cap && b.groupSize && b.groupSize > cap;
  let rows = "";
  const add = (k,v) => { if (v) rows += "<dt>" + k + "</dt><dd>" + esc(v) + "</dd>"; };
  if (showRoom) add("Room", roomLabel(b.roomId));
  add("Instructor", b.instructor);
  if (b.groupSize) {
    rows += "<dt>Group</dt><dd>" + b.groupSize +
            (cap ? " of " + cap + " seats" : " students") +
            (over ? "<span class='flag over'>OVER CAPACITY</span>" : "") + "</dd>";
  }
  add("Contact", b.contact);
  if (b.groupId) {
    const others = bookings.filter(x => x.groupId === b.groupId && x.id !== b.id)
                           .map(x => roomLabel(x.roomId));
    if (others.length) add("Also in", others.join(", "));
  }
  add("Setup", b.setup);
  let stn = "";
  if (b.stations && b.stations.length) {
    stn = "<div style='margin-top:8px'>" + b.stations.map(x =>
      "<span class='stationline'><b style='color:var(--fg)'>" + esc(x.label) +
      "</b>" + (x.skill ? " — " + esc(x.skill) : "") +
      (x.supplies ? "<br><span style='color:var(--note)'>" + esc(x.supplies) +
       "</span>" : "") + "</span>").join("") + "</div>";
  }
  let itm = "";
  if (b.items && b.items.length) {
    itm = "<div>" + b.items.map(x => {
      const inv = itemById(x.id);
      const over = itemBooked(x.id, b.date) > (inv.qty || 0);
      return "<span class='itemchip" + (over ? " over" : "") + "'>" +
        esc(inv.name || x.name || x.id) +
        ((x.qty||1) > 1 ? " \u00d7" + x.qty : "") +
        (x.station ? " @ " + esc(x.station) : "") +
        (over ? " \u26a0" : "") + "</span>";
    }).join("") + "</div>";
  }
  const editBtn = user
    ? "<button class='btn ghost small edit-one' data-id='" + b.id + "'>Edit</button>"
    : "";
  return "<div class='entry' style='border-left-color:" +
         (colors[b.color]||colors.grey||"#7a8794") + "'>" +
         "<div class='entryhead'><h3>" + esc(b.course||"") +
         (b.status === "tentative" ? "<span class='flag'>TENTATIVE</span>" : "") +
         "</h3>" + editBtn + "</div>" +
         "<div class='when'>" + (b.block ? esc(b.block) : "Time not set") +
         "</div>" + (rows ? "<dl class='kv'>" + rows + "</dl>" : "") + stn + itm + "</div>";
}

function openPopup(title, key, bodyHtml) {
  document.getElementById("cardRoom").textContent = title;
  document.getElementById("cardDate").textContent = longDate(key);
  const note = notes[key] || {};
  document.getElementById("cardBody").innerHTML = bodyHtml +
    (note.text ? "<div id='cardNote'>" + esc(note.text) + "</div>" : "");
  overlay.classList.add("on");
  wireActions();
  setTimeout(startAutoClose, 0);   // after the body is in the DOM

  wasRotating = rotating;           // a wall board must return to the grid alone
  rotating = false;
  startAutoClose();
}

// Nothing with a field in it ever times out. The countdown is for someone
// who tapped a cell and walked away, not for someone mid-sentence.
function isEditing() {
  return !!document.querySelector("#cardBody input, #cardBody select, " +
                                  "#cardBody textarea");
}

function startAutoClose() {
  clearTimeout(closeTimer); clearInterval(countdown);
  const tip = document.getElementById("timeout");
  if (isEditing()) { tip.textContent = ""; return; }
  let left = settings.popupSec || 30;
  tip.textContent = "Closing in " + left + "s";
  countdown = setInterval(() => {
    if (isEditing()) { stopTimers(); return; }   // a field appeared — stand down
    tip.textContent = "Closing in " + (--left) + "s";
  }, 1000);
  closeTimer = setTimeout(() => { if (!isEditing()) closePopup(); },
                          (settings.popupSec || 30) * 1000);
}

function closePopup() {
  overlay.classList.remove("on");
  clearTimeout(closeTimer); clearInterval(countdown);
  rotating = wasRotating; lastFlip = Date.now();
}

let openCell = null;      // {date, roomId} currently shown

function openRoom(key, roomId) {
  openCell = { date:key, roomId };
  const list = bookings.filter(b => b.date === key && b.roomId === roomId);
  const body = (list.length
      ? list.map(b => entryHtml(b,false)).join("")
      : "<p class='empty'>No bookings - room is open.</p>")
    + "<div id='acts'>" + (user
        ? "<button class='btn' id='addOne'>+ Add booking</button>"
        : "<button class='btn ghost' id='needLogin'>Sign in to edit</button>")
      + "<button class='btn ghost' id='setupSheet'>Room setup sheet</button>"
      + "</div>";
  openPopup("Room " + roomLabel(roomId), key, body);
}

// Everything that has to be physically set up in one room on one day,
// station by station. This is the view to read before touching the room.
function setupSheet(key, roomId) {
  stopTimers();
  const room = rooms.find(r => r.id === roomId) || {};
  const list = bookings.filter(b => b.date === key && b.roomId === roomId);
  const stations = room.stations || [];

  let body = "";
  if (!stations.length) {
    body = "<p class='empty'>No beds or tables set up for " +
           esc(room.label||roomId) + " yet.</p>" +
           (user ? "" : "<p class='empty'>Sign in to add them.</p>");
  } else {
    body = stations.map(st => {
      const uses = [];
      list.forEach(b => (b.stations||[]).forEach(x => {
        if (x.id === st.id && (x.skill || x.supplies))
          uses.push({ course:b.course, block:b.block, skill:x.skill,
                      supplies:x.supplies, color:b.color });
      }));
      if (!uses.length) {
        return "<div class='setup' style='border-left-color:#4a6a88'>" +
          "<b>" + esc(st.label) + "</b> " +
          "<span class='tag'>" + esc(st.type||"") + "</span>" +
          "<span class='stationline'>No skill assigned for this day</span></div>";
      }
      return uses.map(u =>
        "<div class='setup' style='border-left-color:" +
        (colors[u.color]||colors.grey||"#7a8794") + "'>" +
        "<b>" + esc(st.label) + "</b> <span class='tag'>" + esc(st.type||"") +
        "</span><span class='sk'> — " + esc(u.skill || u.course || "") +
        (u.block ? " (" + esc(u.block) + ")" : "") + "</span>" +
        (u.supplies ? "<span class='sup'>" + esc(u.supplies) + "</span>" : "") +
        "</div>").join("");
    }).join("");
  }
  if (stations.length && !list.length) {
    body = "<p class='empty'>Nothing is booked in " + esc(room.label||roomId) +
           " on this day, so no skills are assigned to its " + stations.length +
           " stations yet.</p>" + body;
  } else if (stations.length) {
    body = "<p class='empty'>Skills come from the bookings in this room. " +
           "Edit a booking to assign them.</p>" + body;
  }
  body += "<div id='acts'>" +
    (user && list.length
      ? "<button class='btn' id='assignHere'>Assign skills</button>" : "") +
    (user ? "<button class='btn' id='editStn'>" +
            (stations.length ? "Edit beds &amp; tables" : "Set up beds &amp; tables") +
            "</button>" : "") +
    "<button class='btn ghost' id='backRoom'>Back</button></div>";
  openPopup("Setup — " + (room.label||roomId), key, body);
  const back = document.getElementById("backRoom");
  if (back) back.onclick = () => openRoom(key, roomId);
  const ed = document.getElementById("editStn");
  if (ed) ed.onclick = () => stationEditor(key, roomId);
  const as = document.getElementById("assignHere");
  if (as) as.onclick = () => editForm(list[0]);
}

// Add or rename a room's beds and tables without leaving the board.
function stationEditor(key, roomId) {
  if (!user) return;
  stopTimers();
  const room = rooms.find(r => r.id === roomId) || {};
  let draft = JSON.parse(JSON.stringify(room.stations || []));

  function paint() {
    const list = draft.length
      ? draft.map((st,i) =>
          "<div class='stn'><div class='itemrow'>" +
          "<select class='sx_type' data-i='" + i + "' style='width:120px'>" +
            ["bed","table","chair","trainer","other"].map(t =>
              "<option" + (st.type === t ? " selected" : "") + ">" + t +
              "</option>").join("") +
          "</select>" +
          "<input class='sx_label' data-i='" + i + "' value='" +
            esc(st.label||"") + "' placeholder='Name staff use out loud'>" +
          "<button class='btn ghost small sx_del' data-i='" + i +
            "'>&times;</button>" +
          "</div></div>").join("")
      : "<p class='empty'>Nothing yet — add a bed or a table below.</p>";

    document.getElementById("cardBody").innerHTML =
      "<div class='f'>" + list +
      "<div id='quickPick' style='margin-top:10px'>" +
        "<button class='btn ghost small sx_add' data-t='bed'>+ Bed</button>" +
        "<button class='btn ghost small sx_add' data-t='table'>+ Table</button>" +
        "<button class='btn ghost small sx_add' data-t='chair'>+ Chair</button>" +
        "<button class='btn ghost small sx_add' data-t='trainer'>+ Trainer</button>" +
        "<button class='btn ghost small sx_add' data-t='other'>+ Other</button>" +
      "</div>" +
      "<p style='margin-top:16px'>" +
        "<button class='btn' id='sx_save'>Save</button>" +
        "<button class='btn ghost' id='sx_cancel'>Cancel</button>" +
      "</p></div>";

    document.querySelectorAll(".sx_type").forEach(e =>
      e.onchange = () => draft[+e.dataset.i].type = e.value);
    document.querySelectorAll(".sx_label").forEach(e =>
      e.oninput = () => draft[+e.dataset.i].label = e.value);
    document.querySelectorAll(".sx_del").forEach(e =>
      e.onclick = () => { draft.splice(+e.dataset.i,1); paint(); });
    document.querySelectorAll(".sx_add").forEach(e => e.onclick = () => {
      const t = e.dataset.t;
      const n = draft.filter(x => x.type === t).length + 1;
      draft.push({ id: t + n + "_" + Date.now().toString(36).slice(-4), type: t,
                   label: t.charAt(0).toUpperCase() + t.slice(1) + " " + n });
      paint();
    });
    document.getElementById("sx_cancel").onclick = () => setupSheet(key, roomId);
    document.getElementById("sx_save").onclick = async () => {
      const clean = draft.filter(x => (x.label||"").trim());
      await updateDoc(doc(db,"rooms",roomId), { stations: clean });
      // Update our local copy right away. The listener will confirm it a
      // moment later, but the popup repaints now and must not read stale data.
      const local = rooms.find(r => r.id === roomId);
      if (local) local.stations = clean;
      setupSheet(key, roomId);
    };
  }

  document.getElementById("cardRoom").textContent =
    "Beds & tables — " + (room.label||roomId);
  document.getElementById("cardDate").textContent =
    "Applies to this room every day, not just " + longDate(key);
  paint();
}

function equipmentDay(key) {
  stopTimers();
  let body = "";
  if (!inventory.length) {
    body = "<p class='empty'>No equipment listed yet.</p>";
  } else {
    body = inventory.map(it => {
      const uses = itemUsage(it.id, key);
      const used = uses.reduce((n,u) => n + (u.qty||1), 0);
      const free = (it.qty||0) - used;
      const over = free < 0;
      const colour = over ? "#ff9e9e" : used ? "#e0b36a" : (colors.grey||"#7a8794");
      let where = uses.map(u =>
        "<span class='stationline'>" + esc(roomLabel(u.roomId)) +
        (u.station ? " / " + esc(u.station) : "") +
        (u.course ? " — " + esc(u.course) : "") +
        (u.block ? " (" + esc(u.block) + ")" : "") +
        ((u.qty||1) > 1 ? "  \u00d7" + u.qty : "") + "</span>").join("");
      if (!uses.length) where = "<span class='stationline'>Not in use</span>";
      return "<div class='setup' style='border-left-color:" + colour + "'>" +
        "<b>" + esc(it.name) + "</b> " +
        "<span class='tag'>" + used + " of " + (it.qty||0) + " in use" +
        (over ? " — OVERBOOKED" : free > 0 ? " \u00b7 " + free + " free" : "") +
        "</span>" + where + "</div>";
    }).join("");
  }
  body += "<div id='acts'><button class='btn ghost' id='backDay'>Back</button></div>";
  openPopup("Equipment", key, body);
  const back = document.getElementById("backDay");
  if (back) back.onclick = () => openDay(key);
}

function openDay(key) {
  const note = notes[key] || {};
  if (note.banner) {
    openPopup(note.banner, key, "<p class='empty'>Lab closed - no bookings.</p>");
    return;
  }
  const list = bookings.filter(b => b.date === key)
    .sort((a,b) => rooms.findIndex(r => r.id === a.roomId) -
                   rooms.findIndex(r => r.id === b.roomId));
  openPopup("Whole day", key, (list.length
    ? "<p class='empty'>" + list.length + " bookings across " +
      new Set(list.map(b => b.roomId)).size + " rooms</p>" +
      list.map(b => entryHtml(b,true)).join("")
    : "<p class='empty'>Nothing scheduled.</p>") +
    "<div id='acts'><button class='btn ghost' id='equipDay'>Equipment this day</button></div>");
  const eq = document.getElementById("equipDay");
  if (eq) eq.onclick = () => equipmentDay(key);
}

function wireActions() {
  const body = document.getElementById("cardBody");
  const add  = document.getElementById("addOne");
  const need = document.getElementById("needLogin");
  if (add)  add.onclick  = () => editForm(null);
  if (need) need.onclick = () => signInForm();
  const sheet = document.getElementById("setupSheet");
  if (sheet) sheet.onclick = () => setupSheet(openCell.date, openCell.roomId);
  body.querySelectorAll(".edit-one").forEach(b => {
    b.onclick = () => editForm(bookings.find(x => x.id === b.dataset.id));
  });
}

function signInForm(then) {
  stopTimers();
  document.getElementById("cardBody").innerHTML =
    "<div class='f'><label>Email</label><input id='li_u' type='email'>" +
    "<label>Password</label><input id='li_p' type='password'>" +
    "<p style='margin-top:14px'><button class='btn' id='li_go'>Sign in</button>" +
    "<button class='btn ghost' id='li_x'>Cancel</button></p>" +
    "<p class='empty' id='li_e'></p></div>";
  document.getElementById("li_go").onclick = async () => {
    try {
      await signInWithEmailAndPassword(auth,
        document.getElementById("li_u").value,
        document.getElementById("li_p").value);
      if (then) then();
    } catch (e) { document.getElementById("li_e").textContent = e.message; }
  };
  document.getElementById("li_x").onclick = () => openRoom(openCell.date, openCell.roomId);
}

function editForm(b) {
  if (!user) return signInForm(() => editForm(b));
  stopTimers();                       // never time out mid-edit
  const opts = Object.keys(colors).map(n =>
    "<option value='" + n + "'" +
    (b && b.color === n ? " selected" : "") + ">" + n + "</option>").join("");
  const picked = b ? [b.roomId] : [openCell.roomId];
  const roomBoxes = rooms.map(r =>
    "<label class='" + (picked.includes(r.id) ? "on" : "") + "'>" +
    "<input type='checkbox' class='rm' value='" + r.id + "'" +
    (picked.includes(r.id) ? " checked" : "") + ">" + esc(r.label) + "</label>").join("");
  const groups = [...new Set(rooms.map(r => r.group))];

  document.getElementById("cardBody").innerHTML =
    "<div class='f'>" +
    "<label>Rooms for this event</label>" +
    "<div id='roomPick'>" + roomBoxes + "</div>" +
    "<div id='quickPick'>" +
      groups.map(g => "<button class='btn ghost small qp' data-g='" + g +
                      "'>" + (g||"other") + "</button>").join("") +
      "<button class='btn ghost small qp' data-g='*'>All</button>" +
      "<button class='btn ghost small qp' data-g='-'>None</button>" +
    "</div>" +
    (b && b.groupId
      ? "<label style='margin-top:10px'><input type='checkbox' id='e_all'> " +
        "Apply changes to every room in this event</label>" : "") +
    "<label>Course / group</label><input id='e_course' value='" +
      esc(b ? (b.course||"") : "") + "'>" +
    "<div class='two'>" +
      "<div><label>Block</label><input id='e_block' placeholder='AM, 13:00-16:00' value='" +
        esc(b ? (b.block||"") : "") + "'></div>" +
      "<div><label>Instructor</label><input id='e_inst' value='" +
        esc(b ? (b.instructor||"") : "") + "'></div>" +
    "</div><div class='two'>" +
      "<div><label>Group size</label><input id='e_group' type='number' value='" +
        (b && b.groupSize ? b.groupSize : "") + "'></div>" +
      "<div><label>Contact</label><input id='e_contact' value='" +
        esc(b ? (b.contact||"") : "") + "'></div>" +
    "</div>" +
    "<label>Setup notes (whole room)</label><input id='e_setup' value='" +
      esc(b ? (b.setup||"") : "") + "'>" +
    "<div id='stationBlock'></div>" +
    "<div id='itemBlock'></div>" +
    "<div class='two'>" +
      "<div><label>Color</label><select id='e_color'>" + opts + "</select></div>" +
      "<div><label>Status</label><select id='e_status'>" +
        "<option value='confirmed'>confirmed</option>" +
        "<option value='tentative'" +
          (b && b.status === "tentative" ? " selected" : "") + ">tentative</option>" +
      "</select></div>" +
    "</div>" +
    "<p style='margin-top:16px'>" +
      "<button class='btn' id='e_save'>Save</button>" +
      "<button class='btn ghost' id='e_cancel'>Cancel</button>" +
      (b ? "<button class='btn danger' id='e_del'>Delete</button>" : "") +
    "</p></div>";

  // Station assignments live per room, so an event across several rooms
  // keeps a separate setup for each one.
  const stationsByRoom = {};
  if (b && b.stations) stationsByRoom[b.roomId] = JSON.parse(JSON.stringify(b.stations));
  if (b && b.groupId) {
    bookings.filter(x => x.groupId === b.groupId && x.stations)
            .forEach(x => stationsByRoom[x.roomId] =
                            JSON.parse(JSON.stringify(x.stations)));
  }
  let stnTab = b ? b.roomId : openCell.roomId;

  function readStationInputs() {
    const host = document.getElementById("stationBlock");
    if (!host || !host.querySelector(".st_skill")) return;
    stationsByRoom[stnTab] = [...host.querySelectorAll(".st_skill")].map(i => ({
      id: i.dataset.id, label: i.dataset.label, type: i.dataset.type,
      skill: i.value.trim(),
      supplies: (host.querySelector(".st_sup[data-id='" + i.dataset.id + "']")
                 || {value:""}).value.trim()
    }));
  }

  function drawStations(keepInputs) {
    if (keepInputs !== false) readStationInputs();
    const chosen = [...document.querySelectorAll("#roomPick input:checked")]
                     .map(i => i.value);
    const host = document.getElementById("stationBlock");
    if (!chosen.length) { host.innerHTML = ""; return; }
    if (!chosen.includes(stnTab)) stnTab = chosen[0];

    const tabs = chosen.length > 1
      ? "<div id='quickPick' style='margin-bottom:8px'>" +
        chosen.map(id => "<button class='btn " +
          (id === stnTab ? "" : "ghost") + " small stn_tab' data-id='" + id +
          "'>" + esc(roomLabel(id)) + "</button>").join("") +
        "<button class='btn ghost small' id='stn_copy' " +
          "title='Use this room&apos;s setup for every room in this event'>" +
          "Same for all rooms</button></div>"
      : "";

    const room = rooms.find(r => r.id === stnTab) || {};
    const list = room.stations || [];
    if (!list.length) {
      host.innerHTML = "<label>Stations</label>" + tabs +
        "<p class='empty'>No beds or tables set up for " +
        esc(room.label||"") + " yet. " +
        "<button class='btn ghost small' id='stnShortcut'>Set them up now</button></p>";
      wireStationTabs();
      const sc = document.getElementById("stnShortcut");
      if (sc) sc.onclick = () => stationEditor(openCell.date, stnTab);
      return;
    }

    const have = {};
    (stationsByRoom[stnTab] || []).forEach(x => have[x.id] = x);
    host.innerHTML = "<label>What happens at each station" +
      (chosen.length > 1 ? " — " + esc(room.label||"") : "") + "</label>" + tabs +
      list.map(st => {
        const v = have[st.id] || {};
        return "<div class='stn'><b>" + esc(st.label) + "</b>" +
          "<span class='tag'>" + esc(st.type||"") + "</span>" +
          "<input class='st_skill' data-id='" + st.id + "' data-label='" +
            esc(st.label) + "' data-type='" + esc(st.type||"") +
            "' placeholder='Skill at this station' value='" +
            esc(v.skill||"") + "'>" +
          "<input class='st_sup' data-id='" + st.id +
            "' placeholder='Supplies needed' value='" + esc(v.supplies||"") + "'>" +
          "</div>";
      }).join("");
    wireStationTabs();
  }

  function wireStationTabs() {
    document.querySelectorAll(".stn_tab").forEach(t => t.onclick = () => {
      readStationInputs();
      stnTab = t.dataset.id;
      drawStations(false);
    });
    const copy = document.getElementById("stn_copy");
    if (copy) copy.onclick = () => {
      readStationInputs();
      const src = stationsByRoom[stnTab] || [];
      const chosen = [...document.querySelectorAll("#roomPick input:checked")]
                       .map(i => i.value);
      chosen.forEach(rid => {
        if (rid === stnTab) return;
        const target = (rooms.find(r => r.id === rid) || {}).stations || [];
        // Match by position, since bed 1 in one room is bed 1 in the next.
        stationsByRoom[rid] = target.map((st,i) => ({
          id: st.id, label: st.label, type: st.type,
          skill: (src[i]||{}).skill || "", supplies: (src[i]||{}).supplies || ""
        }));
      });
      alert("Copied this setup to the other " + (chosen.length-1) + " room(s). " +
            "Stations are matched in order, so check rooms with different layouts.");
      drawStations(false);
    };
  }

  // equipment reservations for this booking
  let itemRows = (b && b.items) ? JSON.parse(JSON.stringify(b.items)) : [];
  function drawItems() {
    const host = document.getElementById("itemBlock");
    if (!inventory.length) {
      host.innerHTML = "<label>Equipment</label><p class='empty'>Nothing in the " +
        "inventory yet. <button class='btn ghost small' id='invQuick'>" +
        "Add an item</button></p>";
      const q = document.getElementById("invQuick");
      if (q) q.onclick = quickAddItem;
      return;
    }
    const chosen = [...document.querySelectorAll("#roomPick input:checked")]
                     .map(i => i.value);
    const room = rooms.find(r => r.id === chosen[0]) || {};
    const stations = room.stations || [];

    host.innerHTML = "<label>Equipment reserved</label>" +
      itemRows.map((row,i) => {
        const inv = itemById(row.id);
        const other = itemBooked(row.id, openCell.date, b ? b.id : null);
        const total = other + (row.qty || 1) * Math.max(1, chosen.length);
        const over  = total > (inv.qty || 0);
        return "<div class='itemrow'>" +
          "<select class='it_id' data-i='" + i + "'>" +
            inventory.map(it => "<option value='" + it.id + "'" +
              (it.id === row.id ? " selected" : "") + ">" + esc(it.name) +
              " (" + (it.qty||0) + ")</option>").join("") +
          "</select>" +
          "<input type='number' min='1' class='it_qty' data-i='" + i +
            "' value='" + (row.qty||1) + "'>" +
          (stations.length
            ? "<select class='it_st' data-i='" + i + "'><option value=''>— station —</option>" +
              stations.map(st => "<option value='" + esc(st.label) + "'" +
                (row.station === st.label ? " selected" : "") + ">" +
                esc(st.label) + "</option>").join("") + "</select>"
            : "") +
          "<span class='avail " + (over ? "over" : "ok") + "'>" +
            total + " of " + (inv.qty||0) + (over ? " — OVERBOOKED" : " that day") +
          "</span>" +
          "<button class='btn ghost small it_del' data-i='" + i + "'>&times;</button>" +
          "</div>";
      }).join("") +
      "<button class='btn ghost small' id='itAdd'>+ Reserve equipment</button>" +
      "<button class='btn ghost small' id='itNew'>+ New item in inventory</button>";

    host.querySelectorAll(".it_id").forEach(e => e.onchange = () => {
      itemRows[+e.dataset.i].id = e.value; drawItems(); });
    host.querySelectorAll(".it_qty").forEach(e => e.onchange = () => {
      itemRows[+e.dataset.i].qty = parseInt(e.value,10) || 1; drawItems(); });
    host.querySelectorAll(".it_st").forEach(e => e.onchange = () => {
      itemRows[+e.dataset.i].station = e.value; });
    host.querySelectorAll(".it_del").forEach(e => e.onclick = () => {
      itemRows.splice(+e.dataset.i,1); drawItems(); });
    const add = document.getElementById("itAdd");
    if (add) add.onclick = () => {
      itemRows.push({ id: inventory[0].id, qty: 1, station: "" }); drawItems(); };
    const nw = document.getElementById("itNew");
    if (nw) nw.onclick = () => quickAddItem(drawItems);
  }

  const pick = document.getElementById("roomPick");
  const sync = el => el.classList.toggle("on", el.querySelector("input").checked);
  pick.querySelectorAll("label").forEach(l => {
    l.querySelector("input").onchange = () => { sync(l); drawStations(); drawItems(); };
  });
  drawStations();
  drawItems();
  document.querySelectorAll(".qp").forEach(btn => btn.onclick = () => {
    const g = btn.dataset.g;
    pick.querySelectorAll("label").forEach(l => {
      const id = l.querySelector("input").value;
      const room = rooms.find(r => r.id === id);
      const want = g === "*" ? true : g === "-" ? false : (room.group === g);
      if (g === "*" || g === "-") l.querySelector("input").checked = want;
      else if (want) l.querySelector("input").checked = true;
      sync(l);
    });
    drawStations();
  });

  document.getElementById("e_cancel").onclick =
    () => openRoom(openCell.date, openCell.roomId);

  document.getElementById("e_save").onclick = async () => {
    const v = id => document.getElementById(id).value.trim();
    const data = {
      date: openCell.date, roomId: openCell.roomId,
      course: v("e_course"), block: v("e_block"), instructor: v("e_inst"),
      contact: v("e_contact"), setup: v("e_setup"),
      groupSize: parseInt(v("e_group"),10) || 0,
      color: v("e_color"), status: v("e_status"),
      updatedBy: user.email, updatedAt: serverTimestamp()
    };

    readStationInputs();
    const stationsFor = rid =>
      (stationsByRoom[rid] || []).filter(x => x.skill || x.supplies);

    const items = itemRows.filter(r => r.id).map(r => ({
      id: r.id, name: itemById(r.id).name, qty: r.qty || 1,
      station: r.station || ""
    }));
    if (items.length || (b && b.items)) data.items = items;
    const chosen = [...document.querySelectorAll("#roomPick input:checked")]
                     .map(i => i.value);
    if (!chosen.length) { alert("Pick at least one room."); return; }

    // One event across several rooms is stored as one booking per room,
    // tied together by a shared groupId so it can be edited or removed
    // as a unit later.
    const gid = (b && b.groupId) || (chosen.length > 1
                  ? "g" + Date.now().toString(36) : null);

    const applyAll = document.getElementById("e_all");
    if (b && applyAll && applyAll.checked && b.groupId) {
      const sibs = bookings.filter(x => x.groupId === b.groupId);
      for (const sib of sibs)
        await updateDoc(doc(db,"bookings",sib.id),
          Object.assign({}, data, {roomId: sib.roomId, groupId: gid,
                                   stations: stationsFor(sib.roomId)}));
    } else if (b) {
      await updateDoc(doc(db,"bookings",b.id),
        Object.assign({}, data, {roomId: chosen[0], groupId: gid,
                                 stations: stationsFor(chosen[0])}));
    }

    // Any newly ticked room that has no booking in this event yet.
    const already = b
      ? bookings.filter(x => x.groupId && x.groupId === b.groupId)
                .map(x => x.roomId).concat([b.roomId])
      : [];
    for (const rid of chosen) {
      if (b && (already.includes(rid) || rid === chosen[0])) continue;
      await addDoc(collection(db,"bookings"),
        Object.assign({}, data, {roomId: rid, groupId: gid,
                                 stations: stationsFor(rid)}));
    }
    openRoom(openCell.date, chosen.includes(openCell.roomId)
             ? openCell.roomId : chosen[0]);
  };

  const del = document.getElementById("e_del");
  if (del) del.onclick = async () => {
    const sibs = b.groupId ? bookings.filter(x => x.groupId === b.groupId) : [b];
    const msg = sibs.length > 1
      ? "Delete this booking from all " + sibs.length + " rooms?\n\n" +
        "Cancel to delete only " + roomLabel(b.roomId) + "."
      : "Delete this booking?";
    if (confirm(msg)) {
      for (const sib of sibs) await deleteDoc(doc(db,"bookings",sib.id));
    } else if (sibs.length > 1) {
      await deleteDoc(doc(db,"bookings",b.id));
    } else { return; }
    openRoom(openCell.date, openCell.roomId);
  };
}

document.getElementById("gear").onclick = () => window.open("settings.html","_blank");
document.getElementById("who").onclick = () => {
  if (user) { if (confirm("Sign out of editing?")) signOut(auth); }
  else { openCell = openCell || {date: iso(new Date()), roomId: (rooms[0]||{}).id};
         openPopup("Staff sign in", openCell.date, ""); signInForm(); }
};

/* ---------- rotation, clock, watchdog ---------- */
setInterval(() => {
  if (!rotating) return;
  if (settings.layout === "multi") return;   // nothing to rotate in wall mode
  const every = (settings.rotateSec || 25) * 1000;
  if (Date.now() - lastFlip >= every) {
    lastFlip = Date.now();
    const n = Math.max(1, settings.weeks || 2);
    let next = (offset + 1) % n;
    if (settings.skipEmptyWeeks !== false) {
      // Do not flip to a blank week; it looks like the board broke.
      for (let i = 0; i < n && !weekHasBookings(next); i++) next = (next + 1) % n;
      if (!weekHasBookings(next)) next = 0;
    }
    offset = next;
    render();
  }
}, 1000);

setInterval(() => {
  document.getElementById("clock").textContent =
    new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  // Only complain after a sustained outage. A two-second blip is not worth
  // shouting about, and the cached schedule on screen is still correct.
  const graceMs = (settings.offlineGraceMin || 5) * 60 * 1000;
  const stale = cacheSince && (Date.now() - cacheSince > graceMs);
  document.getElementById("offline").style.display = stale ? "block" : "none";
  if (iso(new Date()) !== startDay && !overlay.classList.contains("on")) location.reload();
}, 30000);
</script>
</body>
