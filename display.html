<style>

  .panel { border:1px solid var(--line); border-radius:8px; overflow:hidden;

             margin:9px 0 2px; }

<section id="notes">

  <div id="noteBox">
    <h3 id="noteBoxTitle">New note</h3>

      <button class="btn" id="noteSave">Save</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
         memoryLocalCache, collection, doc, query, where, orderBy, onSnapshot,
         addDoc, updateDoc, deleteDoc, setDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { firebaseConfig, COLORS as FALLBACK_COLORS, DEFAULT_SETTINGS }
  from "./firebase-config.js";
import { buildList, score, badge } from "./checklist.js";

// Persistent cache: if the network drops, the board keeps showing the last
// known schedule instead of going blank.
const fbApp = initializeApp(firebaseConfig);
// autoDetectLongPolling: campus networks, proxies and VPN clients often break
// Firestore's streaming connection, which is what produced the constant
// "connection lost" banner. This makes the SDK fall back to long polling.
const db = initializeFirestore(fbApp, {
  localCache: persistentLocalCache(),
  experimentalAutoDetectLongPolling: true
});
const auth = getAuth(fbApp);
let user = null;
onAuthStateChanged(auth, u => { user = u; paintAuth(); });
const DAYS = ["Mon","Tues","Wed","Thurs","Fri","Sat","Sun"];
console.log("display.html build 2026-11-18-fit");

let rooms = [], bookings = [], notes = {}, offset = 0, rotating = true;
let settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
let colors = settings.colors;
let lastData = Date.now(), lastFlip = Date.now();
let browseShift = 0, browseAt = 0;   // weeks away from now, and when they asked
let haveData = false, cacheSince = 0;

// Firestore reports whether a snapshot came from the server or the local
// cache. That is far more reliable than navigator.onLine, which flaps on
// campus wifi and VPNs and was causing the banner to flash on and off.
function noteSnapshot(snap) {
  const fromCache = snap.metadata && snap.metadata.fromCache;
  if (fromCache) { if (!cacheSince) cacheSince = Date.now(); }
  else { cacheSince = 0; lastData = Date.now(); }
  return fromCache;
}
const startDay = iso(new Date());

function iso(d) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0")
         + "-" + String(d.getDate()).padStart(2,"0");
}
function addDays(d,n) { const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function mondayOf(d) {
  const x = new Date(d);
  x.setDate(x.getDate() - ((x.getDay()+6) % 7));
  x.setHours(0,0,0,0);
  return x;
}
function esc(s) {
  return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

// Black or white, whichever actually reads on the colour behind it. Used for
// booking chips, banner text and the Comments column, because every one of
// those sits on a background the user can change.
function contrastOn(hex) {
  const h = String(hex || "").replace("#", "");
  if (h.length !== 6) return "#ffffff";
  // WCAG relative luminance, then whichever of black or white actually
  // contrasts better. A fixed cutoff leaves mid-tones like teal unreadable.
  const lin = i => {
    const v = parseInt(h.slice(i, i + 2), 16) / 255;
    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  };
  const L = 0.2126 * lin(0) + 0.7152 * lin(2) + 0.0722 * lin(4);
  return ((L + 0.05) / 0.05) >= (1.05 / (L + 0.05)) ? "#13202c" : "#ffffff";
}
const themeColor = k => (settings.theme && settings.theme[k]) ||
                        DEFAULT_SETTINGS.theme[k];

// If nothing has arrived after 12 seconds, say so instead of waiting mutely.
setTimeout(() => {
  if (!rooms.length) {
    document.getElementById("wkTitle").textContent = "No rooms loaded";
    document.getElementById("sub").textContent =
      "The board could not read the room list. Check the browser console (F12), " +
      "or that the rooms collection exists and the rules are published.";
  }
}, 12000);

const base = mondayOf(new Date());
const rangeStart = iso(addDays(base,-120)); // back far enough to look at past weeks
const rangeEnd   = iso(addDays(base,370));  // a full year, so any selected week has data

/* ---------- live settings ---------- */
onSnapshot(doc(db,"settings","display"), snap => {
  if (snap.exists()) {
    const s = snap.data();
    settings = Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), s);
    if (s.theme)  settings.theme  = Object.assign({}, DEFAULT_SETTINGS.theme, s.theme);
    if (s.colors) settings.colors = s.colors;
  }
  colors = Object.assign({}, FALLBACK_COLORS, settings.colors || {});
  applyTheme();
  render();
  renderNotes();
});

function applyTheme() {
  const r = document.documentElement.style;
  const t = settings.theme || {};
  Object.keys(t).forEach(k => r.setProperty("--" + k, t[k]));
  r.setProperty("--s", settings.scale || 1);
  document.getElementById("clock").className = settings.showClock ? "" : "hide";
  document.getElementById("admin").className =
    settings.showAdminButtons === false ? "hide" : "";
  const navEl = document.getElementById("nav");
  navEl.style.display = (settings.showNavButtons === false) ? "none" : "flex";
  console.log("nav buttons:", navEl.style.display,
              "| showNavButtons =", settings.showNavButtons);

  const logo = document.getElementById("logo");
  if (settings.logoUrl) { logo.src = settings.logoUrl; logo.hidden = false; }
  else { logo.hidden = true; }

  const bd = document.getElementById("board").style;
  bd.setProperty("--wm", settings.watermarkUrl
    ? "url('" + settings.watermarkUrl + "')" : "none");
  bd.setProperty("--wmop", settings.watermarkUrl
    ? ((settings.watermarkOpacity || 8) / 100) : 0);
  bd.setProperty("--wmsize", (settings.watermarkSize || 55) + "%");
  if (offset >= (settings.weeks || 2)) offset = 0;
}

/* ---------- live data ---------- */
onSnapshot(query(collection(db,"rooms"), orderBy("order")), snap => {
  const fromCache = noteSnapshot(snap);
  if (fromCache && snap.empty && rooms.length) return;
  rooms = snap.docs.map(d => ({id:d.id, ...d.data()})).filter(r => r.active !== false);
  render();
}, err => console.error("rooms listener:", err));
onSnapshot(query(collection(db,"bookings"),
                 where("date",">=",rangeStart), where("date","<=",rangeEnd)), snap => {
  const fromCache = noteSnapshot(snap);
  // An empty snapshot served from cache during a dropout is not news --
  // it is the absence of news. Keep what is already on screen.
  if (fromCache && snap.empty && haveData) return;
  bookings = snap.docs.map(d => ({id:d.id, ...d.data()}));
  if (bookings.length) haveData = true;
  render();
}, err => console.error("bookings listener:", err));
// How far along each session's setup is. Written by the floor view; the
// board only reads it, so a dark screen in the hallway shows what is ready.
onSnapshot(query(collection(db,"setup"),
                 where("date",">=",rangeStart), where("date","<=",rangeEnd)), snap => {
  const next = {};
  snap.docs.forEach(d => {
    const v = d.data();
    next[d.id] = { state: v.state || {}, notes: v.notes || {},
                   extra: v.extra || [], by: v.by || "" };
  });
  setups = next;
  render();
}, err => console.error("setup listener:", err));
onSnapshot(query(collection(db,"dayNotes"),
                 where("date",">=",rangeStart), where("date","<=",rangeEnd)), snap => {
  const fromCache = noteSnapshot(snap);
  if (fromCache && snap.empty && Object.keys(notes).length) return;
  notes = {};
  snap.docs.forEach(d => notes[d.id] = d.data());
  render();
}, err => console.error("dayNotes listener:", err));

// A day can carry several comments now, each with its own colour. Days saved
// before that held a single `text`, so read both and nothing disappears.
function dayComments(n) {
  if (!n) return [];
  if (Array.isArray(n.items) && n.items.length)
    return n.items.filter(c => c && (c.text || "").trim());
  return (n.text || "").trim() ? [{ text: n.text, color: "" }] : [];
}

// A banner decoration: an emoji typed straight in, or an image.
// A bare "turkey.png" counts as an image. It did not before, which made the
// placeholder in Settings a lie: the file name came out as text.
// A file that will not load hides itself rather than leaving a broken icon
// across the middle of a wall display.
function bannerArt(icon) {
  const t = String(icon || "").trim();
  if (!t) return "";
  const isImage = /^https?:\/\//i.test(t) || /^\.{0,2}\//.test(t) ||
                  /\.(png|jpe?g|gif|webp|svg|avif|bmp|ico)(\?.*)?$/i.test(t);
  return isImage
    ? "<img class='bannerimg' src='" + esc(t) +
      "' alt='' onerror=\"this.style.display='none'\">"
    : "<span class='bannericon'>" + esc(t) + "</span>";
}

function weekLabel(off) {
  if (off === 0) return settings.title || "THIS WEEK";
  if (off === 1) return "NEXT WEEK";
  if (off === -1) return "LAST WEEK";
  return (off > 0 ? "IN " + off + " WEEKS" : off + " WEEKS AGO")
         .replace("IN 1 WEEKS","NEXT WEEK");
}

// Paging is open to everyone -- reading the schedule should never need a login.
function browse(n) {
  if (n === 0) { browseShift = 0; browseAt = 0; }
  else { browseShift += n; browseAt = Date.now(); }
  document.getElementById("nav").className = browseShift ? "browsing" : "";
  render();
}
document.getElementById("prevWk").onclick  = () => browse(-1);
document.getElementById("nextWk").onclick  = () => browse(1);
document.getElementById("todayWk").onclick = () => browse(0);

// One week as a table. Used by both layouts.
function weekTableHTML(weekStart, opts) {
  const today = iso(new Date());
  const nDays = settings.showWeekend === false ? 5 : 7;
  const compact = opts && opts.compact;

  let html = "<table class='wk" + (compact ? " compact" : "") + "'>";
  html += "<tr><th>Week</th>";
  rooms.forEach((r,i) => {
    const end = i < rooms.length-1 && rooms[i+1].group !== r.group;
    html += "<th class='" + (end ? "group-end" : "") + "'>" + esc(r.label) + "</th>";
  });
  if (settings.showComments !== false) html += "<th>Comments</th>";
  html += "</tr>";

  for (let i = 0; i < nDays; i++) {
    const d = addDays(weekStart,i), key = iso(d), note = notes[key] || {};
    let rowBg = (key === today) ? themeColor("today") : themeColor("bg");
    // A banner can carry a colour of its own, across the whole row.
    const banBg = note.banner && note.bannerColor
      ? (colors[note.bannerColor] || "") : "";
    if (banBg) rowBg = banBg;
    const rowInk = contrastOn(rowBg);
    html += "<tr class='" + (key === today ? "today" : "") + "'>";
    html += "<td class='day clickable' data-date='" + key + "'" +
            (banBg ? " style='background:" + banBg + ";color:" + rowInk + "'" : "") +
            ">" + DAYS[i] + "<br>" + (d.getMonth()+1) + "/" + d.getDate() + "</td>";
    if (note.banner) {
      html += "<td colspan='" + rooms.length + "' class='banner' style='color:" +
              rowInk + (banBg ? ";background:" + banBg : "") + "'>" +
              bannerArt(note.icon) + esc(note.banner) +
              bannerArt(note.icon) + "</td>";
    } else {
      rooms.forEach((r,ri) => {
        const end = ri < rooms.length-1 && rooms[ri+1].group !== r.group;
        const cells = bookings.filter(b => b.date === key && b.roomId === r.id);
        html += "<td class='clickable " + (end ? "group-end" : "") +
                "' data-date='" + key + "' data-room='" + r.id + "'>";
        cells.forEach(b => {
          const chipBg = colors[b.color] || colors.grey || "#7a8794";
          html += "<span class='chip " + (b.status === "tentative" ? "tentative" : "") +
                  "' style='background:" + chipBg + ";color:" + contrastOn(chipBg) + "'>" +
                  (b.icon ? esc(b.icon) + " " : "") + esc(b.course||"") +
                  (compact ? "" : setupMark(b)) +
                  (!compact && b.block ? "<small>" + esc(b.block) + "</small>" : "") +
                  "</span>";
        });
        html += "</td>";
      });
    }
    if (settings.showComments !== false) {
      const cs = dayComments(note);
      // The comments cell sits on the same row, so it takes the colour too.
      html += "<td class='notes clickable' data-note='" + key + "' style='color:" +
        rowInk + (banBg ? ";background:" + banBg : "") + "'>" +
        (cs.length ? cs.map(c => {
          const bg = c.color ? colors[c.color] : "";
          return bg
            ? "<span class='cmt' style='background:" + bg + ";color:" +
              contrastOn(bg) + "'>" + esc(c.text) + "</span>"
            : "<span class='cmt plain'>" + esc(c.text) + "</span>";
        }).join("") : "<span class='addnote'>+</span>") + "</td>";
    }
    html += "</tr>";
  }
  return html + "</table>";
}

// A quiet suffix on the chip: ticked off, part way, or something missing.
function setupMark(b) {
  const m = ckMark(b);
  return m ? "<i class='ckmark" + (m === "\u26a0" ? " bad" : m === "\u2713" ? " ok" : "") +
             "' title='Room setup'>" + m + "</i>" : "";
}

// Only http(s) addresses get through. A javascript: link saved onto a shared
// board would run for everyone who tapped it.
function safeUrl(u) {
  const t = String(u || "").trim();
  if (!t) return "";
  if (/^https?:\/\//i.test(t)) return t;
  return /^[\w.-]+\.[a-z]{2,}([\/?#]|$)/i.test(t) ? "https://" + t : "";
}

function weekRangeText(weekStart) {
  return weekStart.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " - " +
         addDays(weekStart,6).toLocaleDateString(undefined,{month:"short",day:"numeric"});
}

function render() {
  if (!rooms.length) return;
  const multi = settings.layout === "multi";
  document.body.classList.toggle("multi", multi);
  document.body.classList.toggle("fit", settings.fitToScreen !== false);
  return multi ? renderMulti() : renderSingle();
}

function renderSingle() {
  const off = offset + browseShift;
  const weekStart = addDays(base, off*7);
  document.getElementById("wkTitle").textContent = weekLabel(off);
  document.getElementById("sub").textContent =
    weekStart.toLocaleDateString(undefined,{month:"long",day:"numeric"}) + " - " +
    addDays(weekStart,6).toLocaleDateString(undefined,
      {month:"long",day:"numeric",year:"numeric"});

  paintSemTag(weekStart);

  const host = document.getElementById("board");
  host.style.removeProperty("--cols");
  host.innerHTML = weekTableHTML(weekStart, {compact:false});

  // Make an empty week unmistakable. Without this, rotating to a blank
  // next week reads as "the schedule vanished".
  const ws = weekStart, we = addDays(weekStart,6);
  const any = bookings.some(b => {
    const d = new Date(b.date+"T00:00:00");
    return d >= ws && d <= we;
  });
  if (!any) {
    const p = document.createElement("div");
    p.id = "emptyWeek";
    p.textContent = "Nothing scheduled this week yet.";
    host.appendChild(p);
  }
  fitText(host);
}

/* ---- making long names fit their column ---------------------------
   A course like "Fundamentals" is one word wider than a room column, so it
   used to spill past the cell and get cut off mid-word. Each label is now
   shrunk just enough to sit inside its own cell. Measuring is done for the
   whole board at once and the new sizes written at once, so the browser
   lays the board out a handful of times rather than once per chip.
   Nothing is shrunk past FIT_MIN of its set size -- past that point it
   would be unreadable from the floor, so the word is allowed to break
   instead. */
const FIT_MIN = 0.65;
const FIT_SEL = ".chip, .banner, th, td.day, td.notes";

function fitText(root) {
  if (!root) return;
  const els = Array.prototype.slice.call(root.querySelectorAll(FIT_SEL));
  if (!els.length) return;
  els.forEach(el => {
    el.style.fontSize = "";
    el.style.overflowWrap = "";
    delete el.dataset.fitBase;
  });
  for (let round = 0; round < 4; round++) {
    // Read everything first.
    const work = [];
    els.forEach(el => {
      const room = el.clientWidth;
      if (!room) return;
      if (el.scrollWidth <= room + 1) return;
      work.push({ el, ratio: room / el.scrollWidth,
                  now: parseFloat(getComputedStyle(el).fontSize) || 0 });
    });
    if (!work.length) return;
    // Then write everything.
    let changed = false;
    work.forEach(w => {
      if (!w.now) return;
      const base = parseFloat(w.el.dataset.fitBase || "") || w.now;
      w.el.dataset.fitBase = base;
      const floor = base * FIT_MIN;
      const want  = Math.max(floor, w.now * w.ratio * 0.97);
      if (want < w.now - 0.1) { w.el.style.fontSize = want.toFixed(2) + "px";
                                changed = true; }
      else { w.el.style.overflowWrap = "anywhere"; }
    });
    if (!changed) return;
  }
}

/* The board is sized in vw, so a window change resizes every cell. */
let fitTimer = 0;
addEventListener("resize", () => {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(() => fitText(document.getElementById("board")), 150);
});
/* First paint can happen before the webfont arrives, which would make
   every measurement a little narrow. */
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => fitText(document.getElementById("board")));
}

function renderMulti() {
  const n     = Math.max(1, Math.min(26, settings.multiWeeks || 8));
  const start = (settings.startOffset || 0) + browseShift;
  const cols  = Math.max(1, Math.min(6, settings.multiCols || 3));

  const first = addDays(base, start*7);
  const last  = addDays(base, (start + n - 1)*7 + 6);
  document.getElementById("wkTitle").textContent =
    settings.title || (n + " WEEKS");
  document.getElementById("sub").textContent =
    first.toLocaleDateString(undefined,{month:"long",day:"numeric"}) + " - " +
    last.toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"});

  paintSemTag(first);

  const host = document.getElementById("board");
  host.style.setProperty("--cols", cols);
  let html = "<div id='panels'>";
  for (let i = 0; i < n; i++) {
    const off = start + i;
    const ws  = addDays(base, off*7);
    const isNow = off === 0;
    html += "<section class='panel" + (isNow ? " now" : "") + "'>" +
            "<h2>" + (isNow ? "THIS WEEK" : weekTag(ws)) +
            " <span>" + weekRangeText(ws) + "</span></h2>" +
            weekTableHTML(ws, {compact:true}) + "</section>";
  }
  host.innerHTML = html + "</div>";
  fitText(host);
}

// Which semester a week belongs to, and its number within that semester.
// Counting runs from whichever semester started most recently on or before
// the week in question, so the numbering restarts at WK 1 each term instead
// of running to WK 40 by summer.
// Weeks that do not count towards the number: spring break, a holiday week,
// anything listed in Settings. Held as the Monday of each week, so checking
// one is a single string compare.
function breakWeeks() {
  const out = {};
  (settings.breaks || []).forEach(b => {
    if (!b || !b.start) return;
    const s0 = mondayOf(new Date(b.start + "T00:00:00"));
    const e0 = mondayOf(new Date((b.end || b.start) + "T00:00:00"));
    if (isNaN(s0) || isNaN(e0) || e0 < s0) return;
    for (let c = new Date(s0); c <= e0; c = addDays(c, 7))
      out[iso(c)] = b.name || "Break";
  });
  return out;
}

function semesterOf(d) {
  const mon = mondayOf(d);
  const base3 = [
    ["Spring", settings.springStart],
    ["Summer", settings.summerStart],
    ["Fall",   settings.fallStart],
    // the old single field still counts, so nothing breaks on upgrade
    ["",       settings.semesterStart]
  ].filter(t => t[1])
   .map(t => ({ name: t[0], d: new Date(t[1] + "T00:00:00") }))
   .filter(t => !isNaN(t.d));
  if (!base3.length) return null;

  // The three dates describe a year that repeats, so project each term into
  // the neighbouring years too. Without this the count runs on for ever and
  // next August reads "Summer WK 12" instead of "Fall WK 1".
  const terms = [];
  for (const t of base3)
    for (const shift of [-1, 0, 1]) {
      const d = new Date(t.d);
      d.setFullYear(d.getFullYear() + shift);
      terms.push({ name: t.name, start: mondayOf(d) });
    }
  terms.sort((a, b) => a.start - b.start);

  // the latest term that has already begun
  let pick = terms[0];
  for (const t of terms) if (t.start <= mon) pick = t;

  // Count the weeks rather than subtracting dates, so a break week can simply
  // be skipped: the week after spring break carries on from the week before it.
  const skip = breakWeeks();
  let week = 0;
  for (let c = new Date(pick.start); c <= mon; c = addDays(c, 7))
    if (!skip[iso(c)]) week++;
  const onBreak = skip[iso(mon)] || "";
  return { name: pick.name, year: pick.start.getFullYear(),
           week: onBreak ? null : week, breakName: onBreak };
}

function weekNumber(d) {
  const t = semesterOf(d);
  if (!t) return Math.round((d - mondayOf(new Date())) / 604800000);
  return t.week == null ? 0 : t.week;
}

// "WK 12", "Fall WK 12", or the name of the break when the week is one.
function weekTag(d) {
  const t = semesterOf(d);
  if (!t) return "WK " + weekNumber(d);
  if (t.week == null) return (t.breakName || "BREAK").toUpperCase();
  return (t.name ? t.name + " " : "") + "WK " + t.week;
}

// The header badge: "FALL 2026 - WEEK 13", or "SPRING 2027 - SPRING BREAK".
function semesterBadge(d) {
  const t = semesterOf(d);
  if (!t) return "";
  const term = (t.name ? t.name + " " : "") + t.year;
  return term + " \u00b7 " + (t.week == null
    ? (t.breakName || "Break") : "Week " + t.week);
}
function paintSemTag(d) {
  const el = document.getElementById("semTag");
  if (!el) return;
  const t = semesterOf(d);
  el.textContent = settings.showSemester === false ? "" : semesterBadge(d);
  el.classList.toggle("onbreak", !!(t && t.week == null));
}

function weekHasBookings(off) {
  const ws = addDays(base, off*7), we = addDays(ws, 6);
  return bookings.some(b => {
    const d = new Date(b.date+"T00:00:00");
    return d >= ws && d <= we;
  });
}

/* ---------- setup checklists ---------- */
let setups = {};
const setupOf = id => setups[id] || { state:{}, notes:{}, extra:[], by:"" };

// Built exactly the way the floor view builds it, so the two agree.
function ckScore(b) {
  const su = setupOf(b.id);
  return score(buildList(Object.assign({}, b, { __extra: su.extra || [] }),
                         { skills, inventory, roomLabel: roomLabelOf }),
               su.state);
}
// Quiet until somebody has actually started. A wall of "0/10" on every
// booking would be noise, not news.
function ckMark(b) {
  const sc = ckScore(b);
  if (!sc.total) return "";
  if (sc.missing) return "⚠";
  if (sc.ready) return "✓";
  return sc.done ? sc.done + "/" + sc.total : "";
}

/* ---------- skill library ---------- */
let skills = [];
onSnapshot(collection(db,"skills"), snap => {
  if (snap.metadata.fromCache && snap.empty && skills.length) return;
  skills = snap.docs.map(d => ({id:d.id, ...d.data()}))
             .sort((a,b) => (a.name||"").localeCompare(b.name||""));

}, err => console.error("skills listener:", err));

const skillByName = n => skills.find(k =>
  (k.name||"").toLowerCase() === String(n||"").toLowerCase());
const skillSupplies = k => (k.items||[])
  .map(i => i.name + (i.qty > 1 ? " \u00d7" + i.qty : "")).join(", ");

/* ---------- equipment inventory ---------- */
let inventory = [];

onSnapshot(collection(db,"inventory"), snap => {
  const fromCache = noteSnapshot(snap);
  if (fromCache && snap.empty && inventory.length) return;
  inventory = snap.docs.map(d => ({id:d.id, ...d.data()}))
                  .sort((a,b) => (a.name||"").localeCompare(b.name||""));

const itemById = id => inventory.find(i => i.id === id) || {name:id, qty:0};
const roomLabelOf = id => (rooms.find(r => r.id === id) || {}).label || id;

// Where to fetch it from, and whether the shelf is running low.
function itemHome(it) { return it.room ? roomLabelOf(it.room) : ""; }
function itemLow(it) {
  if (!it.par) return false;
  return (it.qty || 0) <= it.par;
}

// Every reservation of one item on one date, with where it is going.
function itemUsage(itemId, date, ignoreBookingId) {
  const out = [];
  bookings.forEach(b => {
    if (b.date !== date || b.id === ignoreBookingId) return;
    (b.items||[]).forEach(x => {
      if (x.id === itemId)
        out.push({ qty: x.qty || 1, roomId: b.roomId, course: b.course,
                   block: b.block, station: x.station || "" });
    });
  });
  return out;
}
function itemBooked(itemId, date, ignoreBookingId) {
  return itemUsage(itemId, date, ignoreBookingId)
           .reduce((n,u) => n + (u.qty||1), 0);
}

// Add something to the inventory without leaving whatever you were doing.
async function quickAddItem(then) {
  if (!user) return;
  const name = prompt("What is it? (e.g. HAL manikin)");
  if (!name || !name.trim()) return;
  const qty = parseInt(prompt("How many does the lab have?", "1"), 10);
  const where = prompt("Which room is it kept in? (room number, or blank)",
                       openCell ? openCell.roomId : "") || "";
  const id = name.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,40);
  await setDoc(doc(db,"inventory",id),
    { name: name.trim(), qty: isNaN(qty) ? 1 : qty,
      room: where.trim(), par: 0, category: "", notes: "" });
  if (typeof then === "function") setTimeout(then, 400);
}

// What a skill needs, item by item, checked against what the lab has.
function skillSheet(name) {

  const list = name ? [skillByName(name)].filter(Boolean) : skills;
  if (!list.length) {

      const inv = inventory.find(i =>

                               else closePopup(); };

/* ---------- brainstorm notes ---------- */
let boardNotes = [], editingNote = null, noteColor = "yellow", noteHex = null;

// Pick black or white text for a background, so a custom colour can never
// produce an unreadable note.
function readableOn(hex) {
  const h = String(hex || "").replace("#", "");
  if (h.length !== 6) return "#ffffff";
  // WCAG relative luminance, then whichever of black or white actually
  // contrasts better. A fixed cutoff leaves mid-tones like teal unreadable.
  const lin = i => {
    const v = parseInt(h.slice(i, i + 2), 16) / 255;
    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  };
  const L = 0.2126 * lin(0) + 0.7152 * lin(2) + 0.0722 * lin(4);
  return ((L + 0.05) / 0.05) >= (1.05 / (L + 0.05)) ? "#13202c" : "#ffffff";
}
const noteHexOf = n => n.hex || colors[n.color] || colors.yellow || "#b08f00";

onSnapshot(query(collection(db,"boardNotes"), orderBy("createdAt","desc")), snap => {
  const fromCache = noteSnapshot(snap);
  if (fromCache && snap.empty && boardNotes.length) return;
  boardNotes = snap.docs.map(d => ({id:d.id, ...d.data()}));
  renderNotes();
}, err => console.error("boardNotes listener:", err));

function renderNotes() {
  const sec = document.getElementById("notes");
  sec.className = settings.showNotes === false ? "hide" : "";
  document.getElementById("notesTitle").textContent =
    settings.notesTitle || "Notes & Ideas";
  document.documentElement.style.setProperty("--nh",
    (settings.notesHeightVh || 24) + "vh");
  document.documentElement.style.setProperty("--nch",
    (settings.noteCardHeight || 150) + "px");
  document.documentElement.style.setProperty("--nw",
    (settings.noteCardWidth || 240) + "px");
  document.getElementById("addNote").style.display = user ? "" : "none";

  const list = document.getElementById("noteList");
  const tops = boardNotes.filter(n => !n.parentId);
  const repliesOf = id => boardNotes.filter(n => n.parentId === id)
    .sort((a,b) => (whenMs(a.createdAt) - whenMs(b.createdAt)));
  const sorted = tops.slice().sort((a,b) => (b.pinned?1:0) - (a.pinned?1:0));
  if (!sorted.length) {
    const bg = colors.grey || "#7a8794";
    list.innerHTML = "<div class='note' style='background:" + bg + ";color:" +
      readableOn(bg) + "'>" +
      (user ? "No notes yet. Tap + Add note to start one."
            : "No notes yet.") + "</div>";
    return;
  }
  list.innerHTML = sorted.map(n => {
    const bg = noteHexOf(n);
    const reps = repliesOf(n.id);
    const thread = reps.map(r =>
      "<span class='reply' data-id='" + r.id + "'><b>" +
      esc((r.author||"").split("@")[0]) + "</b> " + esc(r.text||"") + "</span>").join("");
    return "<div class='note" + (n.pinned ? " pinned" : "") + "' data-id='" +
      n.id + "' style='background:" + bg + ";color:" + readableOn(bg) + "'>" +
      "<span class='body'>" + esc(n.text || "") +
      (thread ? "<span class='thread'>" + thread + "</span>" : "") + "</span>" +
      "<span class='meta'>" + esc((n.author||"").split("@")[0]) +
      (n.updatedAt ? " &middot; " + fmtWhen(n.updatedAt) : "") +
      (reps.length ? " &middot; " + reps.length +
        (reps.length === 1 ? " reply" : " replies") : "") +
      (user ? "<button class='replybtn' data-id='" + n.id + "'>Reply</button>" : "") +
      "</span></div>";
  }).join("");

  // flag the cards whose text is cut off
  list.querySelectorAll(".note[data-id]").forEach(el => {
    const bodyEl = el.querySelector(".body");
    if (bodyEl && bodyEl.scrollHeight > bodyEl.clientHeight + 2)
      el.classList.add("more");
  });

  list.querySelectorAll(".replybtn").forEach(btn => btn.onclick = ev => {
    ev.stopPropagation();
    noteEditor(null, btn.dataset.id);
  });
  list.querySelectorAll(".reply").forEach(el => el.onclick = ev => {
    ev.stopPropagation();
    const r = boardNotes.find(x => x.id === el.dataset.id);
    if (user && r) noteEditor(r, r.parentId);
  });

  list.querySelectorAll(".note[data-id]").forEach(el => {
    el.onclick = () => {
      const n = boardNotes.find(x => x.id === el.dataset.id);
      if (n) noteViewer(n);
    };
  });
}

function whenMs(ts) {
  try { return ts.toDate ? ts.toDate().getTime() : new Date(ts).getTime(); }
  catch (e) { return 0; }
}

function fmtWhen(ts) {
  try {
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
  } catch (e) { return ""; }
}

let replyTo = null;

// Cards are all one size so the strip stays tidy; this shows the whole thing.
// Reading is open to everyone, editing still needs a sign-in.
function noteViewer(n) {
  const bg = noteHexOf(n);
  const reps = boardNotes.filter(x => x.parentId === n.id)
    .sort((a,b) => whenMs(a.createdAt) - whenMs(b.createdAt));
  document.getElementById("noteBoxTitle").textContent =
    (n.author||"").split("@")[0] + " \u00b7 " + (fmtWhen(n.updatedAt) || "");
  const box = document.getElementById("noteBox");
  box.dataset.mode = "view";
  document.getElementById("noteText").style.display = "none";
  document.getElementById("noteColors").style.display = "none";
  document.getElementById("noteHint").style.display = "none";

  let extra = box.querySelector(".full");
  if (!extra) {
    extra = document.createElement("div");
    extra.className = "full";
    box.insertBefore(extra, document.getElementById("noteText"));
  }
  extra.style.display = "block";
  extra.style.background = bg;
  extra.style.color = readableOn(bg);
  extra.textContent = n.text || "";

  let th = box.querySelector(".threadfull");
  if (!th) {
    th = document.createElement("div");
    th.className = "threadfull";
    box.insertBefore(th, extra.nextSibling);
  }
  th.innerHTML = reps.map(r => "<div><b>" +
    esc((r.author||"").split("@")[0]) + "</b> " + esc(r.text||"") + "</div>").join("");

  document.getElementById("noteSave").style.display = user ? "" : "none";
  document.getElementById("noteSave").textContent = "Edit";
  document.getElementById("notePin").style.display = user ? "" : "none";
  document.getElementById("noteDel").style.display = "none";
  document.getElementById("noteCancel").textContent = "Close";
  editingNote = n; replyTo = null;
  document.getElementById("noteEditor").classList.add("on");
}

function noteEditor(n, parentId) {
  if (!user) return;
  replyTo = parentId || (n && n.parentId) || null;
  editingNote = n || null;
  noteColor = n ? (n.color || "yellow") : "yellow";
  noteHex = n ? (n.hex || null) : null;
  const parent = replyTo ? boardNotes.find(x => x.id === replyTo) : null;
  document.getElementById("noteBoxTitle").textContent =
    replyTo ? (n ? "Edit reply" : "Reply to: " +
                 (parent ? (parent.text||"").slice(0,60) : "note"))
            : (n ? "Edit note" : "New note");
  document.getElementById("noteText").value = n ? (n.text || "") : "";
  document.getElementById("noteDel").style.display = n ? "" : "none";
  document.getElementById("notePin").textContent =
    n && n.pinned ? "Unpin" : "Pin";
  document.getElementById("notePin").style.display = n ? "" : "none";

  const pal = document.getElementById("noteColors");
  pal.innerHTML = Object.entries(colors).map(([name,hex]) =>
      "<button data-c='" + name + "' data-hex='" + hex + "' title='" + name +
      "' style='background:" + hex + "' class='" +
      (!noteHex && name === noteColor ? "sel" : "") + "'></button>").join("") +
    "<span class='customwrap'><input type='color' id='noteCustom' value='" +
      (noteHex || colors[noteColor] || "#b08f00") + "' title='Any colour'>" +
      "custom</span>";

  function applyPreview() {
    const bg = noteHex || colors[noteColor] || "#b08f00";
    const ta = document.getElementById("noteText");
    ta.style.background = bg;
    ta.style.color = readableOn(bg);
  }

  pal.querySelectorAll("button").forEach(b => b.onclick = () => {
    noteColor = b.dataset.c; noteHex = null;
    pal.querySelectorAll("button").forEach(x => x.className = "");
    b.className = "sel";
    applyPreview();
  });
  const custom = document.getElementById("noteCustom");
  custom.oninput = () => {
    noteHex = custom.value; noteColor = "custom";
    pal.querySelectorAll("button").forEach(x => x.className = "");
    applyPreview();
  };
  applyPreview();

  const box = document.getElementById("noteBox");
  box.dataset.mode = "edit";
  const full = box.querySelector(".full"), th = box.querySelector(".threadfull");
  if (full) full.style.display = "none";
  if (th) th.innerHTML = "";
  document.getElementById("noteText").style.display = "";
  document.getElementById("noteColors").style.display = "";
  document.getElementById("noteHint").style.display = "";
  document.getElementById("noteSave").textContent = "Save";
  document.getElementById("noteCancel").textContent = "Cancel";
  document.getElementById("noteDel").style.display = n ? "" : "none";

  document.getElementById("noteEditor").classList.add("on");
  const ta = document.getElementById("noteText");
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
}

function closeNoteEditor() {
  document.getElementById("noteEditor").classList.remove("on");
  editingNote = null; replyTo = null;
}

async function saveNote() {
  const text = document.getElementById("noteText").value.trim();
  if (!text) { closeNoteEditor(); return; }
  const data = { text, color: noteColor, hex: noteHex || null,
                 author: user.email, updatedAt: serverTimestamp() };
  if (replyTo) data.parentId = replyTo;
  if (editingNote) await updateDoc(doc(db,"boardNotes",editingNote.id), data);
  else await addDoc(collection(db,"boardNotes"),
                    Object.assign({createdAt: serverTimestamp(), pinned:false}, data));
  closeNoteEditor();
}

document.getElementById("addNote").onclick = () => noteEditor(null);
document.getElementById("noteSave").onclick = () => {
  const box = document.getElementById("noteBox");
  if (box.dataset.mode === "view") { noteEditor(editingNote, editingNote.parentId); }
  else saveNote();
};
document.getElementById("noteCancel").onclick = closeNoteEditor;
document.getElementById("noteDel").onclick = async () => {
  if (editingNote && confirm("Delete this note?")) {
    await deleteDoc(doc(db,"boardNotes",editingNote.id));
    closeNoteEditor();
  }
};
document.getElementById("notePin").onclick = async () => {
  if (!editingNote) return;
  await updateDoc(doc(db,"boardNotes",editingNote.id), { pinned: !editingNote.pinned });
  closeNoteEditor();
};
document.getElementById("noteEditor").addEventListener("click", ev => {
  if (ev.target.id === "noteEditor") closeNoteEditor();
});
document.getElementById("noteText").addEventListener("keydown", ev => {
  if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); saveNote(); }
  if (ev.key === "Escape") closeNoteEditor();
});

/* ---------- tap-for-detail popup ---------- */
const overlay = document.getElementById("overlay");
let closeTimer = null, countdown = null, wasRotating = true;

const roomOf    = id => rooms.find(r => r.id === id) || {};
const roomLabel = id => roomOf(id).label || id;
const longDate  = k => new Date(k + "T00:00:00")
  .toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});

function entryHtml(b, showRoom) {
  const cap  = roomOf(b.roomId).capacity;
  const over = cap && b.groupSize && b.groupSize > cap;
  let rows = "";
  const add = (k,v) => { if (v) rows += "<dt>" + k + "</dt><dd>" + esc(v) + "</dd>"; };
  if (showRoom) add("Room", roomLabel(b.roomId));
  add("Instructor", b.instructor);
  if (b.groupSize) {
    rows += "<dt>Group</dt><dd>" + b.groupSize +
            (cap ? " of " + cap + " seats" : " students") +
            (over ? "<span class='flag over'>OVER CAPACITY</span>" : "") + "</dd>";
  }
  add("Contact", b.contact);
  if (b.groupId) {
    const others = bookings.filter(x => x.groupId === b.groupId && x.id !== b.id)
                           .map(x => roomLabel(x.roomId));
    if (others.length) add("Also in", others.join(", "));
  }
  add("Setup", b.setup);
  let stn = "";
  if (b.stations && b.stations.length) {
    stn = "<div style='margin-top:8px'>" + b.stations.map(x =>
      "<span class='stationline'><b style='color:var(--fg)'>" + esc(x.label) +
      "</b>" + (x.skill ? " — " + esc(x.skill) : "") +
      (x.supplies ? "<br><span style='color:var(--note)'>" + esc(x.supplies) +
       "</span>" : "") + "</span>").join("") + "</div>";
  }
  let itm = "";
  if (b.items && b.items.length) {
    itm = "<div>" + b.items.map(x => {
      const inv = itemById(x.id);
      const over = itemBooked(x.id, b.date) > (inv.qty || 0);
      const low  = itemLow(inv);
      const home = itemHome(inv);
      return "<span class='itemchip" + (over || low ? " over" : "") + "'>" +
        esc(inv.name || x.name || x.id) +
        ((x.qty||1) > 1 ? " \u00d7" + x.qty : "") +
        (x.station ? " @ " + esc(x.station) : "") +
        (home ? " \u2014 from " + esc(home) : "") +
        (over ? " \u26a0 overbooked" : low ? " \u26a0 low stock" : "") +
        "</span>";
    }).join("") + "</div>";
  }
  const sc = ckScore(b);
  let ck = "";
  if (sc.total) {
    const su = setupOf(b.id);
    const flagged = [];
    buildList(Object.assign({}, b, { __extra: su.extra || [] }),
              { skills, inventory, roomLabel: roomLabelOf })
      .forEach(g => g.lines.forEach(l => {
        if (su.state[l.key] === "missing")
          flagged.push(l.text + (su.notes[l.key] ? " \u2014 " + su.notes[l.key] : ""));
      }));
    ck = "<div class='setupbar'><span class='ckmark " +
      (sc.missing ? "bad" : sc.ready ? "ok" : "") + "'>" + esc(badge(sc)) +
      "</span> <span class='setupwho'>" +
      (sc.ready && !sc.missing ? "set up" : sc.done + " of " + sc.total + " done") +
      (su.by ? " \u00b7 " + esc(su.by) : "") + "</span>" +
      (flagged.length ? "<div class='setupmiss'>" +
        flagged.map(t => "\u26a0 " + esc(t)).join("<br>") + "</div>" : "") +
      "</div>";
  }
  const link = safeUrl(b.link);
  const linkRow = link
    ? "<p class='blink'><a href='" + esc(link) + "' target='_blank' " +
      "rel='noopener noreferrer'>Open link \u2197</a></p>" : "";
  const editBtn = user
    ? "<button class='btn ghost small edit-one' data-id='" + b.id + "'>Edit</button>"
    : "";
  return "<div class='entry' style='border-left-color:" +
         (colors[b.color]||colors.grey||"#7a8794") + "'>" +
         "<div class='entryhead'><h3>" + (b.icon ? esc(b.icon) + " " : "") +
         esc(b.course||"") +
         (b.status === "tentative" ? "<span class='flag'>TENTATIVE</span>" : "") +
         "</h3>" + editBtn + "</div>" +
         "<div class='when'>" + (b.block ? esc(b.block) : "Time not set") +
         "</div>" + (rows ? "<dl class='kv'>" + rows + "</dl>" : "") +
         linkRow + ck + stn + itm + "</div>";
}

function openPopup(title, key, bodyHtml) {
  document.getElementById("cardRoom").textContent = title;
  document.getElementById("cardDate").textContent = longDate(key);
  const note = notes[key] || {};
  document.getElementById("cardBody").innerHTML = bodyHtml +
    (note.text ? "<div id='cardNote'>" + esc(note.text) + "</div>" : "");
  overlay.classList.add("on");
  wireActions();
  setTimeout(startAutoClose, 0);   // after the body is in the DOM

  wasRotating = rotating;           // a wall board must return to the grid alone
  rotating = false;
  startAutoClose();
}

// Nothing with a field in it ever times out. The countdown is for someone
// who tapped a cell and walked away, not for someone mid-sentence.
function isEditing() {
  return !!document.querySelector("#cardBody input, #cardBody select, " +
                                  "#cardBody textarea");
}

function startAutoClose() {
  clearTimeout(closeTimer); clearInterval(countdown);
  const tip = document.getElementById("timeout");
  if (isEditing()) { tip.textContent = ""; return; }
  let left = settings.popupSec || 30;
  tip.textContent = "Closing in " + left + "s";
  countdown = setInterval(() => {
    if (isEditing()) { stopTimers(); return; }   // a field appeared — stand down
    tip.textContent = "Closing in " + (--left) + "s";
  }, 1000);
  closeTimer = setTimeout(() => { if (!isEditing()) closePopup(); },
                          (settings.popupSec || 30) * 1000);
}

function closePopup() {
  overlay.classList.remove("on");
  clearTimeout(closeTimer); clearInterval(countdown);
  rotating = wasRotating; lastFlip = Date.now();
}

let openCell = null;      // {date, roomId} currently shown

function openRoom(key, roomId) {
  openCell = { date:key, roomId };
  const list = bookings.filter(b => b.date === key && b.roomId === roomId);
  const body = (list.length
      ? list.map(b => entryHtml(b,false)).join("")
      : "<p class='empty'>No bookings - room is open.</p>")
    + "<div id='acts'>" + (user
        ? "<button class='btn' id='addOne'>+ Add booking</button>"
        : "<button class='btn ghost' id='needLogin'>Sign in to edit</button>")
      + "<button class='btn ghost' id='setupSheet'>Room setup sheet</button>"
      + "<button class='btn ghost' id='skLib'>Skills</button>"
      + "</div>";
  openPopup("Room " + roomLabel(roomId), key, body);
}

// Everything that has to be physically set up in one room on one day,
// station by station. This is the view to read before touching the room.
function setupSheet(key, roomId) {
  stopTimers();
  const room = rooms.find(r => r.id === roomId) || {};
  const list = bookings.filter(b => b.date === key && b.roomId === roomId);
  const stations = room.stations || [];

  let body = "";
  if (!stations.length) {
    body = "<p class='empty'>No beds or tables set up for " +
           esc(room.label||roomId) + " yet.</p>" +
           (user ? "" : "<p class='empty'>Sign in to add them.</p>");
  } else {
    body = stations.map(st => {
      const uses = [];
      list.forEach(b => (b.stations||[]).forEach(x => {
        if (x.id === st.id && (x.skill || x.supplies))
          uses.push({ course:b.course, block:b.block, skill:x.skill,
                      supplies:x.supplies, color:b.color });
      }));
      if (!uses.length) {
        return "<div class='setup' style='border-left-color:#4a6a88'>" +
          "<b>" + esc(st.label) + "</b> " +
          "<span class='tag'>" + esc(st.type||"") + "</span>" +
          "<span class='stationline'>No skill assigned for this day</span></div>";
      }
      return uses.map(u =>
        "<div class='setup' style='border-left-color:" +
        (colors[u.color]||colors.grey||"#7a8794") + "'>" +
        "<b>" + esc(st.label) + "</b> <span class='tag'>" + esc(st.type||"") +
        "</span><span class='sk'> — " + esc(u.skill || u.course || "") +
        (u.block ? " (" + esc(u.block) + ")" : "") + "</span>" +
        (u.supplies ? "<span class='sup'>" + esc(u.supplies) + "</span>" : "") +
        "</div>").join("");
    }).join("");
  }
  if (stations.length && !list.length) {
    body = "<p class='empty'>Nothing is booked in " + esc(room.label||roomId) +
           " on this day, so no skills are assigned to its " + stations.length +
           " stations yet.</p>" + body;
  } else if (stations.length) {
    body = "<p class='empty'>Skills come from the bookings in this room. " +
           "Edit a booking to assign them.</p>" + body;
  }
  // Everything this room needs that day, and which room to fetch it from.
  const fetchList = [];
  list.forEach(b => (b.items||[]).forEach(x => {
    const inv = itemById(x.id);
    fetchList.push({ name: inv.name || x.name || x.id, qty: x.qty || 1,
                     home: itemHome(inv), low: itemLow(inv),
                     station: x.station || "" });
  }));
  if (fetchList.length) {
    body = "<div class='setup' style='border-left-color:#e0b36a'>" +
      "<b>Collect first</b>" + fetchList.map(f =>
        "<span class='stationline'><b style='color:#fff'>" + esc(f.name) +
        ((f.qty||1) > 1 ? " \u00d7" + f.qty : "") + "</b>" +
        (f.home ? " — from " + esc(f.home) : "") +
        (f.station ? " \u2192 " + esc(f.station) : "") +
        (f.low ? "  \u26a0 low stock" : "") + "</span>").join("") +
      "</div>" + body;
  }

  body += "<div id='acts'>" +
    (user && list.length
      ? "<button class='btn' id='assignHere'>Assign skills</button>" : "") +
    (user ? "<button class='btn' id='editStn'>" +
            (stations.length ? "Edit beds &amp; tables" : "Set up beds &amp; tables") +
            "</button>" : "") +
    "<button class='btn ghost' id='backRoom'>Back</button></div>";
  openPopup("Setup — " + (room.label||roomId), key, body);
  const back = document.getElementById("backRoom");
  if (back) back.onclick = () => openRoom(key, roomId);
  const ed = document.getElementById("editStn");
  if (ed) ed.onclick = () => stationEditor(key, roomId);
  const as = document.getElementById("assignHere");
  if (as) as.onclick = () => editForm(list[0]);
}

// Add or rename a room's beds and tables without leaving the board.
function stationEditor(key, roomId) {
  if (!user) return;
  stopTimers();
  const room = rooms.find(r => r.id === roomId) || {};
  let draft = JSON.parse(JSON.stringify(room.stations || []));

  function paint() {
    const list = draft.length
      ? draft.map((st,i) =>
          "<div class='stn'><div class='itemrow'>" +
          "<select class='sx_type' data-i='" + i + "' style='width:120px'>" +
            ["bed","table","chair","trainer","other"].map(t =>
              "<option" + (st.type === t ? " selected" : "") + ">" + t +
              "</option>").join("") +
          "</select>" +
          "<input class='sx_label' data-i='" + i + "' value='" +
            esc(st.label||"") + "' placeholder='Name staff use out loud'>" +
          "<button class='btn ghost small sx_del' data-i='" + i +
            "'>&times;</button>" +
          "</div></div>").join("")
      : "<p class='empty'>Nothing yet — add a bed or a table below.</p>";

    document.getElementById("cardBody").innerHTML =
      "<div class='f'>" + list +
      "<div class='quickpick' style='margin-top:10px'>" +
        "<button class='btn ghost small sx_add' data-t='bed'>+ Bed</button>" +
        "<button class='btn ghost small sx_add' data-t='table'>+ Table</button>" +
        "<button class='btn ghost small sx_add' data-t='chair'>+ Chair</button>" +
        "<button class='btn ghost small sx_add' data-t='trainer'>+ Trainer</button>" +
        "<button class='btn ghost small sx_add' data-t='other'>+ Other</button>" +
      "</div>" +
      "<p style='margin-top:16px'>" +
        "<button class='btn' id='sx_save'>Save</button>" +
        "<button class='btn ghost' id='sx_cancel'>Cancel</button>" +
      "</p></div>";

    document.querySelectorAll(".sx_type").forEach(e =>
      e.onchange = () => draft[+e.dataset.i].type = e.value);
    document.querySelectorAll(".sx_label").forEach(e =>
      e.oninput = () => draft[+e.dataset.i].label = e.value);
    document.querySelectorAll(".sx_del").forEach(e =>
      e.onclick = () => { draft.splice(+e.dataset.i,1); paint(); });
    document.querySelectorAll(".sx_add").forEach(e => e.onclick = () => {
      const t = e.dataset.t;
      const n = draft.filter(x => x.type === t).length + 1;
      draft.push({ id: t + n + "_" + Date.now().toString(36).slice(-4), type: t,
                   label: t.charAt(0).toUpperCase() + t.slice(1) + " " + n });
      paint();
    });
    document.getElementById("sx_cancel").onclick = () => setupSheet(key, roomId);
    document.getElementById("sx_save").onclick = async () => {
      const clean = draft.filter(x => (x.label||"").trim());
      await updateDoc(doc(db,"rooms",roomId), { stations: clean });
      // Update our local copy right away. The listener will confirm it a
      // moment later, but the popup repaints now and must not read stale data.
      const local = rooms.find(r => r.id === roomId);
      if (local) local.stations = clean;
      setupSheet(key, roomId);
    };
  }

  document.getElementById("cardRoom").textContent =
    "Beds & tables — " + (room.label||roomId);
  document.getElementById("cardDate").textContent =
    "Applies to this room every day, not just " + longDate(key);
  paint();
}

// The Comments column, the full-width holiday banner, and its artwork.
function dayNoteForm(key) {
  if (!user) return;
  stopTimers();
  const n = notes[key] || {};
  let items = dayComments(n).map(c => ({ text: c.text || "", color: c.color || "" }));
  if (!items.length) items = [{ text: "", color: "" }];

  const cOpts = sel => "<option value=''" + (sel ? "" : " selected") +
    ">no colour</option>" + Object.keys(colors).map(k =>
      "<option value='" + esc(k) + "'" + (k === sel ? " selected" : "") + ">" +
      esc(k) + "</option>").join("");

  const readRows = () => {
    const host = document.getElementById("cmtRows");
    if (!host) return;
    items = [...host.querySelectorAll(".cmtrow")].map(r => ({
      text: r.querySelector(".cmt_t").value,
      color: r.querySelector(".cmt_c").value }));
  };
  const paintRows = () => {
    const host = document.getElementById("cmtRows");
    host.innerHTML = items.map((c, i) =>
      "<div class='cmtrow' data-i='" + i + "'>" +
        "<input class='cmt_t' value='" + esc(c.text) +
          "' placeholder='Marta out &middot; Lauren out @ 1:00'>" +
        "<select class='cmt_c'>" + cOpts(c.color) + "</select>" +
        "<span class='cmtsw' style='background:" +
          (colors[c.color] || "transparent") + "'></span>" +
        "<button class='btn ghost small cmt_x' title='Remove this comment'>" +
          "&times;</button>" +
      "</div>").join("");
    host.querySelectorAll(".cmt_c").forEach(sel => sel.onchange = () => {
      readRows(); paintRows();
    });
    host.querySelectorAll(".cmt_x").forEach((b, i) => b.onclick = () => {
      readRows();
      items.splice(i, 1);
      if (!items.length) items = [{ text: "", color: "" }];
      paintRows();
    });
  };

  document.getElementById("cardBody").innerHTML =
    "<div class='f'>" +
    "<label>Comments (right-hand column)</label>" +
    "<div id='cmtRows'></div>" +
    "<p><button class='btn ghost small' id='cmt_add'>+ Add another comment" +
      "</button></p>" +
    "<label>Full-width banner — leave blank for a normal day</label>" +
    "<div class='two' style='grid-template-columns:1fr 150px'>" +
      "<div><input id='dn_banner' value='" + esc(n.banner||"") +
        "' placeholder='THANKSGIVING DAY'></div>" +
      "<div><select id='dn_bcolor'>" +
        "<option value=''" + (n.bannerColor ? "" : " selected") +
          ">row colour</option>" +
        Object.keys(colors).map(k => "<option value='" + esc(k) + "'" +
          (k === n.bannerColor ? " selected" : "") + ">" + esc(k) +
          "</option>").join("") +
      "</select></div>" +
    "</div>" +
    "<label>Banner decoration — an emoji, or an image file in the repo</label>" +
    "<input id='dn_icon' value='" + esc(n.icon||"") +
      "' placeholder='&#127790;  or  turkey.png'>" +
    "<p class='hint' style='margin:4px 0 0;font-size:12px;color:#8fb3cc'>" +
      "A picture has to be in the repo next to display.html, and the name has " +
      "to match exactly &mdash; turkey.PNG and turkey.png are different files " +
      "on GitHub Pages. It shows either side of the words.</p>" +
    "<p style='margin-top:16px'>" +
      "<button class='btn' id='dn_save'>Save</button>" +
      "<button class='btn ghost' id='dn_cancel'>Cancel</button>" +
    "</p></div>";
  document.getElementById("cardRoom").textContent = "Comments for this day";
  paintRows();
  document.getElementById("cmt_add").onclick = () => {
    readRows();
    items.push({ text: "", color: "" });
    paintRows();
    const last = document.querySelector("#cmtRows .cmtrow:last-child .cmt_t");
    if (last) last.focus();
  };
  document.getElementById("dn_cancel").onclick = closePopup;
  document.getElementById("dn_save").onclick = async () => {
    const v = id => document.getElementById(id).value.trim();
    readRows();
    const keep = items.map(c => ({ text: (c.text || "").trim(),
                                   color: c.color || "" }))
                      .filter(c => c.text);
    // `text` stays written as the lot joined up, so anything still reading
    // the old single-comment field keeps working.
    const rec = { date: key, items: keep, text: keep.map(c => c.text).join(" \u00b7 "),
                  banner: v("dn_banner"), icon: v("dn_icon"),
                  bannerColor: document.getElementById("dn_bcolor").value,
                  updatedBy: user.email };
    await setDoc(doc(db,"dayNotes",key), rec);
    notes[key] = rec;
    render();
    closePopup();
  };
}

function equipmentDay(key) {
  stopTimers();
  let body = "";
  if (!inventory.length) {
    body = "<p class='empty'>No equipment listed yet.</p>";
  } else {
    body = inventory.map(it => {
      const uses = itemUsage(it.id, key);
      const used = uses.reduce((n,u) => n + (u.qty||1), 0);
      const free = (it.qty||0) - used;
      const over = free < 0;
      const colour = over ? "#ff9e9e" : used ? "#e0b36a" : (colors.grey||"#7a8794");
      let where = uses.map(u =>
        "<span class='stationline'>" + esc(roomLabel(u.roomId)) +
        (u.station ? " / " + esc(u.station) : "") +
        (u.course ? " — " + esc(u.course) : "") +
        (u.block ? " (" + esc(u.block) + ")" : "") +
        ((u.qty||1) > 1 ? "  \u00d7" + u.qty : "") + "</span>").join("");
      if (!uses.length) where = "<span class='stationline'>Not in use</span>";
      const home = itemHome(it);
      return "<div class='setup' style='border-left-color:" + colour + "'>" +
        "<b>" + esc(it.name) + "</b> " +
        "<span class='tag'>" + used + " of " + (it.qty||0) + " in use" +
        (over ? " — OVERBOOKED" : free > 0 ? " \u00b7 " + free + " free" : "") +
        (itemLow(it) ? " \u00b7 LOW STOCK" : "") + "</span>" +
        (home ? "<span class='stationline'>Kept in " + esc(home) + "</span>" : "") +
        where + "</div>";
    }).join("");
  }
  body += "<div id='acts'><button class='btn ghost' id='backDay'>Back</button></div>";
  openPopup("Equipment", key, body);
  const back = document.getElementById("backDay");
  if (back) back.onclick = () => openDay(key);
}

function openDay(key) {
  const note = notes[key] || {};
  if (note.banner) {
    openPopup(note.banner, key, "<p class='empty'>Lab closed - no bookings.</p>");
    return;
  }
  const list = bookings.filter(b => b.date === key)
    .sort((a,b) => rooms.findIndex(r => r.id === a.roomId) -
                   rooms.findIndex(r => r.id === b.roomId));
  openPopup("Whole day", key, (list.length
    ? "<p class='empty'>" + list.length + " bookings across " +
      new Set(list.map(b => b.roomId)).size + " rooms</p>" +
      list.map(b => entryHtml(b,true)).join("")
    : "<p class='empty'>Nothing scheduled.</p>") +
    "<div id='acts'>" +
    (user ? "<button class='btn' id='editDayNote'>Comment &amp; banner</button>" : "") +
    "<button class='btn ghost' id='equipDay'>Equipment this day</button></div>");
  const eq = document.getElementById("equipDay");
  if (eq) eq.onclick = () => equipmentDay(key);
  const dn = document.getElementById("editDayNote");
  if (dn) dn.onclick = () => dayNoteForm(key);
}

document.getElementById("board").addEventListener("click", ev => {
  const td = ev.target.closest("td.clickable");
  if (!td) return;
  if (browseShift) browseAt = Date.now();   // keep the week they are looking at
  if (td.dataset.note) {
    // Straight into the comment for that day -- no detour through the day view.
    if (user) { openCell = { date: td.dataset.note, roomId: (rooms[0]||{}).id };
                openPopup("Day note", td.dataset.note, "");
                dayNoteForm(td.dataset.note); }
    else openDay(td.dataset.note);
  }
  else if (td.classList.contains("day")) openDay(td.dataset.date);
  else openRoom(td.dataset.date, td.dataset.room);
});
document.getElementById("close").onclick = closePopup;
overlay.addEventListener("click", ev => { if (ev.target === overlay) closePopup(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closePopup(); });


/* ---------- editing straight from the board ---------- */
function stopTimers() { clearTimeout(closeTimer); clearInterval(countdown);
                        document.getElementById("timeout").textContent = ""; }

function paintAuth() {
  const w = document.getElementById("who");
  if (!w) return;
  w.className = user ? "on" : "";

                 : "Staff sign in";

  else render();
  renderNotes();

function wireActions() {
